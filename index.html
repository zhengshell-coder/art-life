<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>艺术人生 · 歌词 · 诗词 · 美文</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="艺术人生">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<script>if(/^https?:$/.test(location.protocol)){var _l=document.createElement('link');_l.rel='manifest';_l.href='manifest.webmanifest';document.head.appendChild(_l);}</script>
<style>
:root{--glass:rgba(255,255,255,.55);--glass-bd:rgba(255,255,255,.55);--hairline:rgba(20,30,60,.08);--shadow:0 10px 30px rgba(31,45,90,.10);--tx:#1f2747;--mut:#8b91a8;--ac:#2f7bff;--ac-soft:rgba(47,123,255,.12);--warn:#9a6b00;--fscale:1;--ac2:#0a6cff;--scrim:rgba(10,14,32,.5);--bg1:#dbe6ff;--bg2:#ffe6f3;--bg3:#e7e0ff;--bg4:#eef2fb;--bg5:#f1ecfb;--tint:#eef1fc}
*{box-sizing:border-box}
html{--fscale:1;height:100%}
body{margin:0;padding:0;height:100%;font-family:'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;color:var(--tx);background:var(--bg4);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.bgfx{position:fixed;inset:0;z-index:-4;background:
  radial-gradient(1200px 820px at 12% -8%,var(--bg1) 0%,transparent 58%),
  radial-gradient(1000px 720px at 100% 0%,var(--bg2) 0%,transparent 54%),
  radial-gradient(1100px 900px at 50% 120%,var(--bg3) 0%,transparent 58%),
  radial-gradient(900px 700px at 88% 88%,var(--bg5) 0%,transparent 56%),
  linear-gradient(135deg,var(--bg4),var(--bg5) 50%,var(--bg4));
  background-size:130% 130%;transition:background-color 1s ease;animation:bgDrift 38s ease-in-out infinite alternate}
@keyframes bgDrift{from{background-position:0% 0%,100% 0%,50% 100%,100% 100%,0% 0%}to{background-position:8% 5%,92% 8%,42% 95%,88% 90%,100% 100%}}
.bgVeil{position:fixed;inset:0;z-index:-2;pointer-events:none;transition:background .9s ease;background:radial-gradient(135% 115% at 50% 0%,transparent 42%,rgba(30,40,80,.13) 100%)}
body.hasArt .bgVeil{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.52) 58%,rgba(255,255,255,.68)),radial-gradient(135% 115% at 50% 0%,transparent 42%,rgba(30,40,80,.17) 100%)}
.bgGrain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.32;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");background-size:180px 180px}
.bgArt{position:fixed;inset:0;z-index:-3;background-size:cover;background-position:center;filter:blur(56px) saturate(150%) contrast(105%);transform:scale(1.18);opacity:0;transition:opacity 1s ease,background-image .5s ease;pointer-events:none;animation:artFloat 46s ease-in-out infinite alternate}
.bgArt.on{opacity:.46}
@keyframes artFloat{from{transform:scale(1.18) translate3d(-1.2%,-1%,0)}to{transform:scale(1.26) translate3d(1.4%,1.2%,0)}}
.wrap{max-width:1180px;margin:0 auto;padding:18px 22px 44px}
header{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.brand-row{display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:-2px}
.logo{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--ac),var(--ac2));box-shadow:0 6px 16px var(--ac-soft);color:#fff;transition:background .8s ease}
.brand-text{text-align:center}
h1{font-family:'Xingkai SC','STXingkai','华文行楷','Zhi Mang Xing',cursive;font-size:48px;font-weight:400;letter-spacing:10px;line-height:1.1;text-align:center;text-shadow:0 2px 14px rgba(90,110,240,.14)}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;justify-content:center}
.searchbox{flex:1;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.5);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-bd);border-radius:11px;padding:0 5px 0 10px;box-shadow:var(--shadow);min-width:200px;transition:all .2s}
.searchbox input{flex:1;border:none;outline:none;background:none;font-size:13.5px;padding:7px 2px;color:var(--tx);min-width:0}
.primary{background:linear-gradient(180deg,var(--ac),var(--ac2));color:#fff;border:none;border-radius:9px;padding:7px 14px;font-size:13px;cursor:pointer;white-space:nowrap;box-shadow:0 3px 10px var(--ac-soft);transition:background .8s ease}
.ghost{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--hairline);color:var(--tx);border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.ghost:hover{background:rgba(255,255,255,.85)}
.sel-wrap{position:relative;display:inline-flex;align-items:center}
.sel-wrap select{appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.5);border:1px solid var(--hairline);color:var(--tx);border-radius:9px;padding:7px 26px 7px 12px;font-size:13px;font-family:inherit;cursor:pointer;outline:none;line-height:1.15}
.sel-caret{position:absolute;right:10px;color:var(--mut);font-size:10px;pointer-events:none}
.mus-btn{width:32px;padding:7px 0;text-align:center;font-size:12px;line-height:1;color:var(--mut)}
.mus-btn.on{background:var(--ac);border-color:var(--ac);color:#fff}
.fs-ctrl{display:flex;align-items:center;gap:5px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--hairline);border-radius:9px;padding:4px 10px}
.fs-lab{color:var(--mut)}
.fs-lab.small{font-size:11px}.fs-lab.big{font-size:16px}
.fs-ctrl input[type=range]{width:90px;accent-color:var(--ac)}
.switch{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--mut);cursor:pointer;user-select:none;background:var(--glass);border:1px solid var(--hairline);border-radius:9px;padding:6px 11px}
.switch input{accent-color:var(--ac)}
main{display:grid;grid-template-columns:1fr 336px;gap:18px;align-items:start}
.card{background:var(--glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-bd);border-radius:22px;box-shadow:var(--shadow)}
.col-l.card{padding:14px 16px;background:rgba(255,255,255,.3);border-color:rgba(255,255,255,.5);box-shadow:0 10px 34px rgba(31,45,90,.07)}
.col-r.card{padding:0;position:sticky;top:14px;overflow:hidden;z-index:45;background:rgba(255,255,255,.42);border-color:rgba(255,255,255,.55)}
.empty{padding:34px 18px;text-align:center}
.empty .e-title{font-size:16px;font-weight:700;margin-bottom:6px}
.empty .e-sub{color:var(--mut);font-size:13px;line-height:1.8;margin-bottom:16px}
.demo{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.song-head{margin:6px auto 14px;text-align:center;max-width:820px}
.song-title{font-size:24px;font-weight:700;line-height:1.35;letter-spacing:1.5px}
.song-sub{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:8px;font-size:11.5px;color:var(--mut)}
.song-sub .sub-txt{opacity:.55;letter-spacing:.4px}
.song-sub .sub-txt.dim{opacity:.4}
.head-acts{display:flex;gap:6px;margin-left:4px}
.icon-btn{width:26px;height:26px;border-radius:50%;border:1px solid var(--hairline);background:rgba(255,255,255,.45);color:var(--mut);font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;padding:0}
.icon-btn:hover{background:#fff;color:var(--tx)}
.icon-btn.on{background:var(--ac);border-color:var(--ac);color:#fff}
.song-sub .badge.warn{font-size:10.5px;padding:1px 7px}
.genre-chip{border:1px solid var(--hairline);background:var(--ac-soft);color:var(--ac);border-radius:20px;padding:2px 10px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:700;letter-spacing:.5px;transition:all .2s}
.genre-chip:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
.line.fine .ln{color:var(--ac);font-weight:700}
.line.fine .ln::before{content:"·";margin-right:1px}
.ask-ai{display:block;width:100%;margin-top:16px;border:1px dashed var(--hairline);background:rgba(255,255,255,.4);color:var(--mut);border-radius:10px;padding:8px 10px;font-size:12px;font-family:inherit;cursor:pointer;transition:all .2s}
.ask-ai:hover{background:#fff;color:var(--tx);border-style:solid;border-color:var(--ac)}
.song-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.song-meta .artist{font-size:11px;color:var(--mut);font-weight:400;margin-right:2px}
.badge{font-size:11px;padding:2px 9px;border-radius:20px;background:rgba(20,30,60,.06);color:var(--mut)}
.badge.gray{background:rgba(20,30,60,.05);color:var(--mut)}
.badge.warn{background:rgba(184,134,11,.16);color:var(--warn)}
.star-btn{border:1px solid var(--hairline);background:rgba(255,255,255,.6);color:var(--tx);border-radius:18px;padding:3px 11px;font-size:12px;cursor:pointer}
.star-btn.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.mini{border:1px solid var(--hairline);background:rgba(255,255,255,.6);color:var(--tx);border-radius:8px;padding:3px 9px;font-size:12px;cursor:pointer}
.lyrics{padding:12px 10px 22px;max-height:calc(100vh - 262px);overflow:auto;scroll-behavior:smooth}
.line{display:flex;gap:8px;padding:7px 12px;border-radius:12px;cursor:pointer;line-height:2.15;transition:transform .38s cubic-bezier(.2,.8,.25,1),background .25s,box-shadow .38s, border-color .25s;animation:floatIn .55s cubic-bezier(.2,.7,.3,1) both}
.line:hover{background:rgba(255,255,255,.68);transform:translateY(-3px);box-shadow:0 14px 32px rgba(31,45,90,.12)}
.line.sel{background:linear-gradient(180deg,#ffffff 0%,var(--tint) 100%);border:1px solid rgba(255,255,255,.92);box-shadow:inset 0 2px 0 rgba(255,255,255,.95),inset 0 -3px 8px rgba(31,45,90,.08),inset 4px 0 0 var(--ac),0 1px 0 rgba(255,255,255,.7),0 24px 48px rgba(31,45,90,.32);transform:translateY(-5px) scale(1.07);z-index:3}
.line.sel .ltext{font-weight:700;font-size:calc(21px*var(--fscale));letter-spacing:.3px}
.line.sel .w .b{font-weight:700}
.line.sel .w .a{font-size:calc(13.5px*var(--fscale))}
.line.sel .ln{color:var(--ac);font-weight:700}
.line.meta{padding:3px 12px;opacity:.5}
.line.meta .ln{visibility:hidden;width:0;padding:0}
.line.meta .ltext{font-size:calc(12px*var(--fscale));color:var(--mut)}
.line.meta .w .b{font-size:calc(12px*var(--fscale));color:var(--mut)}
.line.meta .w .a{font-size:calc(11px*var(--fscale));color:#a9b0c4;visibility:hidden}
.line.meta.sel .w .a{visibility:visible}
.w .b{transition:transform .2s,background .2s,color .2s}
.w.hl{transform:scale(1.13)}
.w.hl .b{background:var(--ac);color:#fff;border-radius:9px;padding:0 6px;box-shadow:0 6px 16px rgba(31,45,90,.24)}
.ln{flex:none;width:26px;text-align:right;color:#c2c7d6;font-size:calc(10.5px*var(--fscale));padding-top:9px;font-variant-numeric:tabular-nums}
.ltext{font-size:calc(17px*var(--fscale));min-width:0}
.w{display:inline-flex;flex-direction:column;align-items:center;margin:0 1.5px;vertical-align:baseline}
.w .b{font-size:calc(17px*var(--fscale));line-height:1.75}
.w .a{font-size:calc(11px*var(--fscale));color:var(--mut);line-height:1.4;white-space:nowrap;letter-spacing:.2px;font-family:'PingFang SC','Microsoft YaHei',sans-serif}
.w.zh .b{font-family:'Kaiti SC','STKaiti','KaiTi','楷体','LXGW WenKai',serif}
.w.en{margin:0 3.5px}
.w.en .b{font-size:calc(16px*var(--fscale));font-family:'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print','Bradley Hand',sans-serif}
.w.g .a{color:#b9bfd0}
.tx{font-size:calc(17px*var(--fscale));line-height:1.9}
@keyframes floatIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.line{animation:none!important;transition:none!important;transform:none!important}}
.summary{padding:10px 4px 4px}
.line-panel{padding:16px 16px 18px;max-height:calc(100vh - 184px);overflow:auto}
.p-title{font-size:13px;font-weight:700;color:var(--mut);letter-spacing:.5px}
.p-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.sec-h{margin:14px 0 6px;font-size:12px;font-weight:700;color:var(--mut);border-top:1px solid var(--hairline);padding-top:12px}
.focusing .line-panel .sec-h{opacity:.2;transition:opacity .3s}
.rawline{font-size:calc(17px*var(--fscale));line-height:1.9;margin:6px 0 4px}
.f-zh{font-family:'Kaiti SC','STKaiti','KaiTi','楷体',serif}
.f-en{font-family:'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print','Bradley Hand',sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;flex-direction:column;align-items:center;background:rgba(47,123,255,.08);border-radius:10px;padding:4px 9px;min-width:40px}
.chip .cw{font-size:15px}
.chip .cp{font-size:11px;color:var(--mut)}
.chip.g{background:rgba(120,120,140,.12)}
.chip.g .cp{color:#9aa0b4}
.note{display:flex;gap:8px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--hairline)}
.note .m{font-size:14px;line-height:1.75;color:#7b8194}
.tag{font-size:10.5px;padding:2px 7px;border-radius:6px;font-weight:700;flex:none;color:#fff;background:var(--ac)}
.t-a{background:#8a5a2b}.t-i{background:#0a7d6b}.t-r{background:#7a5cff}.t-p{background:#2f7bff}.t-s{background:#e0532f}.t-k{background:#7a5cff}.t-c{background:#c2185b}.t-t{background:#0a9e8a}.t-g{background:#5b7cfa}.t-n{background:#b8860b}.t-v{background:#6b7280}
.hit{color:var(--ac);font-weight:700}
.refs{font-size:11px;color:var(--mut);flex:none;margin-left:auto}
.sum-item{display:flex;gap:8px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--hairline)}
.sum-item .m{font-size:14px;line-height:1.75}
.hint{color:var(--mut);font-size:13px;line-height:1.8;padding:8px 2px}
.focusbg{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(6px) saturate(85%);-webkit-backdrop-filter:blur(6px) saturate(85%);z-index:40;display:none;cursor:zoom-out;transition:background .8s ease}
.focusing .focusbg{display:block}
.focus-stage{position:fixed;inset:0;z-index:55;display:none;align-items:center;justify-content:center;padding:24px;pointer-events:none}
.focusing .focus-stage{display:flex}
.focus-line{position:relative;max-width:none;width:fit-content;white-space:nowrap;padding:30px 44px;border-radius:24px;background:linear-gradient(180deg,#ffffff,var(--tint));border:1px solid rgba(255,255,255,.95);box-shadow:0 30px 80px rgba(20,30,60,.45),inset 0 2px 0 rgba(255,255,255,.9),inset 4px 0 0 var(--ac);text-align:center;transform:scale(var(--fit,1));transform-origin:center;transition:transform .3s cubic-bezier(.2,.8,.25,1),box-shadow .3s;pointer-events:auto;animation:pullOut .45s cubic-bezier(.2,.8,.25,1)}
@keyframes pullOut{from{opacity:0;transform:scale(calc(var(--fit,1)*.72)) translateY(20px)}to{opacity:1;transform:scale(var(--fit,1)) translateY(0)}}
.focus-line .ltext{font-size:calc(40px*var(--fscale));font-weight:700;line-height:1.5;letter-spacing:.5px;white-space:nowrap}
.focus-line .w .b{font-size:calc(40px*var(--fscale));font-weight:700}
.focus-line .w.en .b{font-size:calc(40px*var(--fscale));font-weight:700;font-family:'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print','Bradley Hand',sans-serif}
.focus-line .w .a{font-size:calc(21px*var(--fscale))}
.focus-line .tx{font-size:calc(40px*var(--fscale));font-weight:700}
.focus-line .ln{display:none}
.focusing .line.sel{opacity:.14;filter:blur(.5px);pointer-events:none;transition:opacity .3s}
.focusing .line:not(.sel){filter:blur(5px);opacity:.2;transition:filter .35s,opacity .35s}
/* 右侧注释栏：降到遮罩之下，并卸掉玻璃卡片的白底，只留极淡的透明影子 */
.focusing .col-r.card{z-index:1;background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.07);box-shadow:none;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);transition:background .35s,box-shadow .35s,border-color .35s}
.focusing .line-panel{filter:blur(9px) brightness(.72) saturate(.35);opacity:.2;pointer-events:none;user-select:none;transition:filter .35s,opacity .35s}
.focusing .col-l.card{background:rgba(255,255,255,.2);box-shadow:none;border-color:rgba(255,255,255,.28);transition:background .35s,box-shadow .35s,border-color .35s}
.focusing header{opacity:.3;filter:blur(2px);transition:opacity .35s,filter .35s}
.focusing .summary{filter:blur(7px) brightness(.8) saturate(.3);opacity:.16;pointer-events:none;user-select:none;transition:filter .35s,opacity .35s}
.focusing .song-head{opacity:.25;filter:blur(1.5px);transition:opacity .35s,filter .35s}

.mask{position:fixed;inset:0;background:rgba(20,30,60,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.m-card{background:var(--glass);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--glass-bd);border-radius:20px;box-shadow:0 24px 60px rgba(20,30,60,.28);width:560px;max-width:100%;max-height:82vh;display:flex;flex-direction:column;overflow:hidden}
.m-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--hairline);font-weight:700}
.m-h .x{border:none;background:none;font-size:20px;cursor:pointer;color:var(--mut);line-height:1}
.m-b{padding:12px 14px 18px;overflow:auto}
.src-h{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:1px;padding:10px 12px 4px;display:flex;align-items:center;gap:6px}
.src-h::after{content:"";flex:1;height:1px;background:var(--hairline)}
.res{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;align-items:center}
.res:hover{background:rgba(255,255,255,.7)}
.rt{font-size:14.5px;font-weight:600}
.ra{font-size:12px;color:var(--mut);margin-top:2px}
.rd{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12px;color:var(--mut);flex:none}
.lib-item{padding:12px;border-radius:14px;background:rgba(255,255,255,.5);margin-bottom:10px;cursor:pointer;border:1px solid var(--hairline)}
.lib-item:hover{background:rgba(255,255,255,.8)}
.lib-row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lib-title{font-size:14.5px;font-weight:600}
.lib-meta{font-size:12px;color:var(--mut);margin-top:4px}
.lib-prog{display:flex;align-items:center;gap:8px;margin-top:8px}
.prog{flex:1;height:6px;background:rgba(20,30,60,.08);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:6px}
.lib-prog span{font-size:11px;color:var(--mut);flex:none}
.lib-del{border:none;background:rgba(20,30,60,.06);color:var(--mut);border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:15px;line-height:1}
.lib-empty{color:var(--mut);font-size:13px;line-height:1.9;text-align:center;padding:24px 10px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(30,38,70,.92);color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;box-shadow:0 10px 30px rgba(20,30,60,.3);z-index:90;max-width:90vw;text-align:center}

/* ================= 页面装饰：竻米 / 竻花 / 山水抚筝 ================= */
.pet-left{position:fixed;left:6px;bottom:16px;z-index:6;pointer-events:none;
  transition:opacity .45s ease,transform .45s ease}
.deco-right{position:fixed;right:12px;bottom:16px;z-index:6;pointer-events:none;
  transition:opacity .45s ease,transform .45s ease}
.lemi3d{display:block;width:150px;height:auto;
  filter:drop-shadow(0 16px 18px rgba(40,45,80,.26));
  animation:lemiIdle 5.2s ease-in-out infinite;transform-origin:50% 92%}

/* 远处两只飞鸟 */
.ss-birds{left:0;top:0;width:100%;height:100%;pointer-events:none}
.ss-bird{position:absolute;width:9px;height:5px;animation:ssFly 38s linear infinite}
.ss-bird path{fill:none;stroke:#3a342e;stroke-width:1.1;stroke-linecap:round;animation:ssFlap .9s ease-in-out infinite;transform-origin:50% 60%}
.ss-bird.b2{animation-delay:-3s;width:7px;height:4px}
.ss-bird.b2 path{animation-duration:.75s}
@keyframes ssFly{0%{transform:translate(300px,52px);opacity:0}6%{opacity:.8}60%{opacity:.8}70%{transform:translate(-20px,24px);opacity:0}100%{transform:translate(-20px,24px);opacity:0}}
@keyframes ssFlap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(-.5)}}
/* 聚焦读一句时，装饰一起退到背景里 */
.focusing .pet-left,.focusing .deco-right{opacity:.1;filter:blur(3px)}
/* 沉浸模式页面变宽，装饰缩小让位给正文 */
.immersive .pet-left{opacity:.55;transform:scale(.72);transform-origin:left bottom}
.immersive .deco-right{opacity:.6;transform:scale(.78);transform-origin:right bottom}
/* 窄屏就别挤了 */
@media (max-width:1340px){.pet-left{display:none}}
@media (max-width:1100px){.deco-right{display:none}}
@media (prefers-reduced-motion:reduce){
  .lemi *,.ss-in,.ss-in *,.ss-in>*{animation:none!important}
}


/* ================= 译文 ================= */
.lbody{display:flex;flex-direction:column;min-width:0;flex:1 1 auto}
.tr{margin-top:3px;font-size:calc(13.5px*var(--fscale));line-height:1.5;color:#6f7994;font-style:italic;letter-spacing:.15px}
.tr.zh{font-style:normal;color:#6b7590;letter-spacing:.7px}
.tr.dim{color:#b6bdcb;font-style:normal}
.line.sel .tr{font-size:calc(14.5px*var(--fscale));color:#59627a;font-weight:500}
.line.meta .tr{display:none}
.tr-btn.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tr-panel{margin:10px 0 2px;padding:9px 12px 10px;border-radius:12px;background:rgba(255,255,255,.5);border:1px solid var(--hairline)}
.tr-h{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.tr-h .tr-lab{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.5px}
.tr-tag{font-size:10.5px;padding:1px 6px;border-radius:999px;border:1px solid transparent;line-height:1.7}
.tr-tag.fine{background:rgba(47,123,255,.12);color:var(--ac2);border-color:rgba(47,123,255,.22)}
.tr-tag.mt{background:rgba(120,130,150,.13);color:#6b7486;border-color:rgba(120,130,150,.22)}
.tr-tag.dim{background:transparent;color:#a8b0c0}
.tr-body{font-size:14px;line-height:1.72;color:var(--tx);font-style:italic}
.tr-body.zh{font-style:normal;letter-spacing:.5px}
.tr-focus{width:0;min-width:100%;box-sizing:border-box;margin-top:14px;padding-top:12px;border-top:1px dashed rgba(90,105,140,.22);white-space:normal;font-size:calc(17px*var(--fscale));line-height:1.55;color:#5c6578;font-style:italic;letter-spacing:.2px;text-align:center}
.tr-focus.zh{font-style:normal;letter-spacing:1px}
.trn .focus-line{min-width:min(70vw,860px)}
.immersive .tr{font-size:calc(12.5px*var(--fscale))}
@media (max-width:760px){.tr-focus{font-size:calc(14px*var(--fscale))}}

.immersive{overflow:hidden}
.immersive .wrap{max-width:none;padding:10px 26px 20px;min-height:100vh;display:flex;flex-direction:column}
.immersive main{flex:1;min-height:0}
/* 沉浸模式：页面变宽，但顶部这排功能不跟着变大 —— 整体缩小并淡出，鼠标移上去才恢复 */
.immersive header{gap:6px;margin-bottom:6px;opacity:.38;transition:opacity .32s ease}
.immersive header:hover,.immersive header:focus-within{opacity:1}
.immersive .brand-row{gap:8px;margin-bottom:-6px}
.immersive .logo{width:26px;height:26px;border-radius:8px;box-shadow:none}
.immersive .logo svg{width:14px;height:14px}
.immersive h1{font-size:22px;letter-spacing:5px;text-shadow:none}
.immersive .toolbar{gap:6px}
.immersive .searchbox{flex:0 1 300px;min-width:190px;padding:0 4px 0 8px;border-radius:8px;box-shadow:none}
.immersive .searchbox input{font-size:12px;padding:4px 2px}
.immersive .searchbox svg{width:13px;height:13px}
.immersive .primary{padding:4px 9px;font-size:11.5px;border-radius:7px;box-shadow:none}
.immersive .ghost{padding:4px 8px;font-size:11.5px;border-radius:7px}
.immersive .sel-wrap select{padding:4px 20px 4px 8px;font-size:11.5px;border-radius:7px}
.immersive .sel-caret{right:8px;font-size:9px}
.immersive .mus-btn{width:26px;padding:4px 0;font-size:11px}
.immersive .fs-ctrl{padding:2px 8px;border-radius:7px}
.immersive .fs-ctrl input[type=range]{width:64px}
.immersive .fs-lab.small{font-size:10px}
.immersive .fs-lab.big{font-size:13px}
.immersive .switch{padding:3px 8px;font-size:11.5px;border-radius:7px}
.immersive .song-head{margin:2px auto 10px}
.immersive .song-title{font-size:21px}
.immersive .lyrics{max-height:calc(100vh - 178px)}
.immersive .line-panel{max-height:calc(100vh - 108px)}

/* ================= 手机版（body.m）================= */
#mBar,#mTabs,#mSearch,#mBanner,.m-grip,.m-pet,.m-big{display:none}
.m{--tabH:56px;--barH:46px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
.m .bgGrain{display:none}
.m header,.m .pet-left,.m .deco-right,.m #btnFs{display:none!important}
.m .wrap{max-width:none;padding:calc(var(--barH) + var(--sat) + 8px) 12px calc(var(--tabH) + var(--sab) + 22px)}
.m.sheet-open .wrap{padding-bottom:calc(56vh + var(--tabH) + var(--sab) + 10px)}
.m main{display:block}
.m button,.m .line,.m .res,.m .ms-chip{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.m input,.m textarea,.m select{font-size:16px!important}       /* 小于 16px 时 iOS 聚焦会自动放大页面 */
/* 顶栏 */
.m #mBar{display:flex;position:fixed;top:0;left:0;right:0;z-index:50;height:calc(var(--barH) + var(--sat));padding:var(--sat) 10px 0 14px;align-items:center;gap:10px;
  background:rgba(247,249,253,.8);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-bottom:.5px solid rgba(20,30,60,.1)}
#mBar .mb-logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
#mBar .mb-logo svg{width:14px;height:14px}
#mTitle{flex:1;min-width:0;font-size:16px;font-weight:700;letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s}
#mTitle.song{letter-spacing:.5px}
#mBar .mb-acts{display:flex;gap:8px;flex:none}
#mBar .mb-acts .ghost{width:38px;height:32px;padding:0;border-radius:10px;font-size:14px;display:flex;align-items:center;justify-content:center;backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(255,255,255,.75)}
#mBar .mb-acts .ghost.on{background:var(--ac);border-color:var(--ac);color:#fff}
/* 底部标签栏 */
.m #mTabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(var(--tabH) + var(--sab));padding-bottom:var(--sab);
  background:rgba(249,250,253,.86);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-top:.5px solid rgba(20,30,60,.1)}
#mTabs button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:#8a90a6;font-family:inherit;padding:0}
#mTabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#mTabs button.on{color:var(--ac)}
#mTabs button.on svg{stroke-width:2.1}
/* 正文 */
.m .song-head{margin:4px 0 6px;padding:0 4px}
.m .song-title{font-size:22px;letter-spacing:1px}
.m .song-sub{flex-wrap:wrap;row-gap:4px}
.m .col-l.card{padding:2px 0 10px;background:transparent;border:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.m .lyrics{max-height:none;overflow:visible;padding:4px 0 10px}
.m .line{padding:9px 10px 9px 6px;border-radius:14px;gap:6px;-webkit-user-select:none;user-select:none;line-height:2.05}
.m .line:hover{background:none;transform:none;box-shadow:none}
.m .line.sel{transform:none;background:rgba(255,255,255,.92);box-shadow:inset 3px 0 0 var(--ac),0 6px 20px rgba(31,45,90,.13)}
.m .line.sel .ltext{font-size:calc(18.5px*var(--fscale))}
.m .ln{min-width:16px;font-size:10px}
.m .summary{padding:16px 6px 6px;border-top:.5px solid var(--hairline);margin-top:6px}
.m .empty{padding:18px 8px 10px}
.m .m-pet{display:block;width:120px;margin:4px auto 10px;filter:drop-shadow(0 10px 14px rgba(40,45,80,.22))}
.m .empty .demo .ghost{padding:10px 14px;font-size:14px;border-radius:12px}
/* 诗词横幅：山水画按屏宽缩放，随正文滚走 */
.m #mBanner{display:block;position:relative;width:100%;border-radius:16px;overflow:hidden;margin:0 0 10px;box-shadow:0 8px 22px rgba(30,40,60,.14)}
.m #mBanner[hidden]{display:none}
.m #mBanner .shanshui{position:absolute;left:0;top:0;width:300px;height:214px;transform-origin:0 0;perspective:none}
.m #mBanner .ss-in{transform:none;animation:none;border-radius:0;box-shadow:none}
/* 解析抽屉 */
.m .col-r.card{position:fixed;left:0;right:0;bottom:calc(var(--tabH) + var(--sab));top:auto;z-index:49;display:flex;flex-direction:column;max-height:56vh;
  border-radius:20px 20px 0 0;border:none;padding:0;background:rgba(252,253,255,.97);backdrop-filter:none;-webkit-backdrop-filter:none;
  box-shadow:0 -12px 40px rgba(20,30,60,.2);transform:translateY(calc(100% + var(--tabH) + var(--sab) + 30px));transition:transform .34s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.m.sheet-open .col-r.card{transform:translateY(0)}
.m .m-grip{display:flex;flex:none;height:22px;align-items:center;justify-content:center;cursor:grab}
.m .m-grip::before{content:"";width:38px;height:5px;border-radius:3px;background:rgba(20,30,60,.18)}
.m .line-panel{flex:1;max-height:none;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 16px 18px}
.m .line-panel .mini{min-width:34px;height:30px;font-size:13px}
.m .m-big{display:inline-flex;align-items:center;justify-content:center}
.m .rawline{font-size:18px}
.m .tr-body{font-size:15px}
/* 大字卡：可换行，左右滑切句 */
.m .focus-stage{padding:16px}
.m .focus-line{white-space:normal;width:auto;max-width:94vw;padding:24px 18px;transform:none!important;border-radius:22px}
.m .focus-line .ltext{white-space:normal;font-size:calc(30px*var(--fscale));line-height:1.6}
.m .focus-line .w .b,.m .focus-line .tx{font-size:calc(30px*var(--fscale))}
.m .focus-line .w.en .b{font-size:calc(28px*var(--fscale))}
.m .focus-line .w .a{font-size:calc(14px*var(--fscale))}
.m .focus-line .tr-focus{font-size:calc(15.5px*var(--fscale))}
.m.trn .focus-line{min-width:0}
/* 弹窗一律做成底部抽屉 */
.m .mask{align-items:flex-end;padding:0;z-index:65}
.m .m-card{width:100%;max-width:none;border-radius:20px 20px 0 0;max-height:86vh;padding-bottom:var(--sab);background:rgba(250,251,254,.98);backdrop-filter:none;-webkit-backdrop-filter:none;animation:mUp .3s cubic-bezier(.2,.8,.2,1)}
@keyframes mUp{from{transform:translateY(40%);opacity:.4}to{transform:none;opacity:1}}
.m .m-h{padding:14px 18px}
.m .m-h .x{font-size:16px;color:var(--ac);font-weight:600}
.m .res{padding:13px 10px}
/* 搜索页 */
.m #mSearch{display:flex;flex-direction:column;position:fixed;inset:0;z-index:70;background:#f5f7fb;
  transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding:calc(var(--sat) + 10px) 14px 0}
.m.ms-open #mSearch{transform:none}
#mSearch .ms-top{display:flex;align-items:center;gap:10px;flex:none}
#mSearch .searchbox{flex:1;height:40px;border-radius:12px;background:#fff;box-shadow:none}
#mSearch .searchbox .primary{height:32px;padding:0 12px;font-size:14px}
#mSearch .ms-cancel{border:none;background:none;color:var(--ac);font-size:16px;font-family:inherit;padding:6px 2px}
#mSearch .ms-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 2px calc(var(--sab) + 20px)}
#mSearch .ms-h{font-size:12px;color:var(--mut);margin:12px 4px 8px;letter-spacing:.5px}
#mSearch .ms-chips{display:flex;flex-wrap:wrap;gap:8px}
#mSearch .ms-chip{border:1px solid var(--hairline);background:#fff;border-radius:18px;padding:8px 14px;font-size:14px;color:var(--tx);font-family:inherit}
/* 设置页 */
.mm-list{padding:6px 16px 18px}
.mm-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:.5px solid var(--hairline)}
.mm-l{font-size:15px;flex:none}
.mm-v{flex:1;display:flex;justify-content:flex-end;min-width:0}
.mm-v .sel-wrap{width:100%;max-width:230px}
.mm-v .sel-wrap select{width:100%;padding:9px 30px 9px 12px;border-radius:10px;background:#fff}
.mm-v .fs-ctrl{background:#fff;padding:6px 12px}
.mm-v .fs-ctrl input[type=range]{width:140px}
.mm-v .switch{background:#fff;padding:9px 12px;font-size:14px}
.mm-note{font-size:12px;color:var(--mut);line-height:1.6;padding:6px 2px 4px}
/* 提示条躲开标签栏 */
.m #toast{bottom:calc(var(--tabH) + var(--sab) + 14px)}
.m.sheet-open #toast{bottom:calc(56vh + var(--tabH) + var(--sab) + 12px)}
@media (prefers-reduced-motion:reduce){.m #mSearch,.m .col-r.card{transition:none}}
</style>

function lookupIPA(raw){
  const w=String(raw).toLowerCase().replace(/^[^a-z']+|[^a-z']+$/g,'');
  if(!w)return null;
  if(IPA_OVER[w])return{ipa:IPA_OVER[w],exact:true};
  if(DICT){
    const cs=wordCandidates(w);
    for(let i=0;i<cs.length;i++){const v=DICT[cs[i]];if(v)return{ipa:arpabetToIpa(v),exact:true};}
  }
  const g=guessIPA(w);
  return g?{ipa:g,exact:false}:null;
}

function enTokens(line){
  const out=[];const re=/[A-Za-z]+(?:['’][A-Za-z]+)*/g;let m;
  while((m=re.exec(line)))out.push({o:m[0],t:m[0].toLowerCase().replace(/’/g,"'")});
  return out;
}

});

function matchPhrases(line){
  const norm=line.toLowerCase().replace(/’/g,"'").replace(/\s+/g,' ').trim();
  const ranges=[],hits=[];
  for(let i=0;i<PHRASES.length;i++){
    const re=PHRASES[i][0];
    re.lastIndex=0;
    const m=re.exec(norm);
    if(!m)continue;
    const s=m.index,e=s+m[0].length;
    let overlap=false;
    for(let r=0;r<ranges.length;r++){if(s<ranges[r][1]&&e>ranges[r][0]){overlap=true;break;}}
    if(overlap)continue;
    ranges.push([s,e]);
    hits.push({tag:PHRASES[i][1],hit:m[0].replace(/^ +| +$/g,''),text:PHRASES[i][2]});
  }
  return hits;
}

const RHETORIC=[

[/[三五七八九十百千万]{1,3}(?:里|丈|尺|年|载|重|叠|层|斛|斗|杯|钧|尺|仞)/,'夸张','以极大的数量放大情感，不必坐实'],
[/(?:何处|何时|几时|谁家|谁人|安得|岂|莫非|可曾|能有几)/,'设问','以问代答，把情绪推到明处'],
[/(?:不知|不见|无人|无处|难觅|寻不见|空余|只余)/,'反衬','以「无」写「有」，用空落反托出心中所念'],
[/(?:啊|呀|兮|哉|矣|也罢|罢了)[。！？]?$/,'咏叹','句末语气词把语调拖长，情绪外放'],
[/[一-龥]{2,4}[，、][一-龥]{2,4}[，、][一-龥]{2,4}/,'排比','三组以上同构短语并列，气势层层推进']

function matchAllusion(line){
  const hits=[];
  for(let i=0;i<ALLUSION.length;i++){
    if(line.indexOf(ALLUSION[i][0])>=0)hits.push({tag:'典故',hit:ALLUSION[i][0],text:ALLUSION[i][1]});
    if(hits.length>=6)break;
  }
  return hits;
}
function matchImagery(line){

    if(line.indexOf(IMAGERY[i][0])>=0)hits.push({tag:'意象',hit:IMAGERY[i][0],text:IMAGERY[i][1]});
    if(hits.length>=5)break;
  }

function matchRhetoric(line){
  const hits=[];
  for(let i=0;i<RHETORIC.length;i++){
    const m=line.match(RHETORIC[i][0]);
    if(m)hits.push({tag:RHETORIC[i][1],hit:(m[0]||'').slice(0,14),text:RHETORIC[i][2]});
  }
  // 对仗：一句之内以逗号分两半，字数相等且都不短
  const parts=line.split(/[，,]/).filter(x=>x.trim());
  if(parts.length===2){
    const a=parts[0].replace(/[^一-鿿]/g,''),b=parts[1].replace(/[^一-鿿]/g,'');
    if(a.length>=4&&a.length===b.length)hits.push({tag:'对仗',hit:'',text:'上下两句字数相等、结构相对，是律诗与骈句的骨架'});
  }
  return hits.slice(0,5);
}
/* 名句判定：短、整齐、无口语虚词，多半是可诵之句 */
const CASUAL=/(?:我们|你们|他们|什么|怎么|这样|那样|一下|然后|但是|因为|所以|其实|真的|好像|可能|应该|已经|正在|还有|就是|一个|一种|okay|yeah|baby|oh)/i;
function isFineLine(line){
  const zh=(line.match(/[一-鿿]/g)||[]).length;
  if(zh<8||zh>20)return false;
  if(CASUAL.test(line))return false;
  const parts=line.split(/[，,]/).filter(x=>x.trim());
  if(parts.length!==2)return false;
  const a=parts[0].replace(/[^一-鿿]/g,''),b=parts[1].replace(/[^一-鿿]/g,'');
  return a.length>=4&&a.length===b.length;
}

function grammarNotes(line,toks){
  const notes=[];
  const push=(tag,text,hit)=>{const k=tag+'|'+text;for(let i=0;i<notes.length;i++){if(notes[i].tag+'|'+notes[i].text===k)return;}notes.push({tag,text,hit:hit||''});};
  const ws=[];
  for(let i=0;i<toks.length;i++){
    const ex=CONTRACT_EXPAND[toks[i].t];
    if(ex){for(let j=0;j<ex.length;j++)ws.push({w:ex[j],s:toks[i].o});}
    else ws.push({w:toks[i].t,s:toks[i].o});
  }
  for(let i=0;i<toks.length;i++){
    const t=toks[i].t;
    if(CONTRACTIONS[t])push('缩略',CONTRACTIONS[t],toks[i].o);
    else if(REDUCE[t])push('口语',REDUCE[t],toks[i].o);
    else if(/^[a-z]+in'$/.test(t))push('口语',toks[i].o+' = '+t.replace(/'$/,'')+'g（口语省略 g）',toks[i].o);
  }
  const g=(i,k)=>ws[i+k]?ws[i+k].w:null;
  const disp=(s,w)=>s.toLowerCase()===w?s:(s+'(='+w+')');
  for(let i=0;i<ws.length;i++){
    const w=ws[i].w,s=ws[i].s;
    const w1=g(i,1),w2=g(i,2);
    if(BE.has(w)){
      if(w1&&/ing$/.test(w1)&&w1.length>5&&!ING_NOUN.has(w1)&&ws[i+1])push('时态',disp(s,w)+' + '+ws[i+1].s+' -> be + V-ing（'+BE_NAME[w]+'进行时）',s+' '+ws[i+1].s);
      else if(w1&&(PP.has(w1)||(w1.length>4&&/ed$/.test(w1)&&!ADV_SKIP.has(w1)))&&ws[i+1])push('句式',disp(s,w)+' + '+ws[i+1].s+' -> be + 过去分词（被动语态或状态）',s+' '+ws[i+1].s);
    }
    if(HAVE.has(w)){
      if(w1==='been'&&w2&&/ing$/.test(w2)&&ws[i+2])push('时态',disp(s,w)+' been '+ws[i+2].s+' -> 完成进行时（have been + V-ing）',s+' been '+ws[i+2].s);
      else if(w1&&(PP.has(w1)||(w1.length>4&&/ed$/.test(w1)))&&ws[i+1])push('时态',disp(s,w)+' + '+ws[i+1].s+' -> '+(w==='had'?'过去完成':'现在完成')+'时（have + 过去分词）',s+' '+ws[i+1].s);
    }
    if(MODAL.has(w)){
      let j=i+1;
      while(j<ws.length&&ADV_SKIP.has(ws[j].w))j++;
      const v=ws[j];
      if(v&&(VBASE.has(v.w)||BE.has(v.w)||HAVE.has(v.w)))push('时态',disp(s,w)+' + '+v.s+' -> 情态动词 '+w+' + 动词原形（'+MODAL_NAME[w]+'）',s+' '+v.s);
    }
    if(w==='going'&&w1==='to'&&w2&&VBASE.has(w2))push('时态','be going to + 动词原形 -> 将要／打算做…');
    if(w==='used'&&w1==='to')push('句式','used to + 动词原形 -> 过去常常（现在不再）');
    if(w==='to'&&w1&&VBASE.has(w1)&&ws[i+1]&&!(ws[i-1]&&ws[i-1].w==='going'))push('句式','to '+ws[i+1].s+' -> 动词不定式');
    if(w==='than'&&ws[i-1]&&/[a-z]er$/.test(ws[i-1].w))push('句式',ws[i-1].s+' than -> 比较级（…er than）',ws[i-1].s+' than');
    if(w==='the'&&w1&&w1.length>5&&/[a-z]est$/.test(w1)&&ws[i+1])push('句式','the '+ws[i+1].s+' -> 最高级','the '+ws[i+1].s);
    if(w==='there'&&(w1==='is'||w1==='are'||w1==='was'||w1==='were'))push('句式','there be 存在句（某处有某物）');
    if(w==='if')push('句式','if 引导条件从句（从句常用一般现在时表将来）');
    if(w==='wish')push('句式','wish + 从句 -> 虚拟语气（表达与事实相反的愿望）');
  }
  if(toks.length){
    const f=toks[0];
    const s2=toks[1]?toks[1].t:'';
    const verb2=BE.has(s2)||HAVE.has(s2)||MODAL.has(s2)||VBASE.has(s2)||(s2.length>4&&/s$|ed$|ing$/.test(s2));
    if(IMP.has(f.t)&&!verb2)push('句式',f.o+' 开头 -> 祈使句（动词原形开头，表请求、命令或号召）',f.o);
    else if(VBASE.has(f.t)&&!verb2)push('句式',f.o+' 开头 -> 可能是祈使句（动词原形开头）',f.o);
    else if(/ing$/.test(f.t)&&f.t.length>6&&!ING_NOUN.has(f.t))push('句式',f.o+' 开头且无主语 -> 省略了主语（歌词常见，多为 I）',f.o);
    else if(/ed$/.test(f.t)&&f.t.length>5)push('句式',f.o+' 开头且无主语 -> 省略了主语（歌词常见，多为 I）',f.o);
    else if(PP.has(f.t)||f.t==='been')push('句式',f.o+' 开头 -> 省略了主语与助动词（歌词常见，如 (I\'ve) '+f.o+'）',f.o);
    if(/n't$/.test(f.t)||f.t==='never')push('句式',f.o+' 开头 -> 否定祈使句',f.o);
  }
  const norm=line.toLowerCase().replace(/’/g,"'").replace(/\s+/g,' ');
  for(let i=0;i<PATTERNS.length;i++){if(PATTERNS[i][0].test(norm))push('句式',PATTERNS[i][1]);}
  return notes.slice(0,9);
}

function pushEnRun(units,s){
  const re=/[A-Za-z]+(?:['’][A-Za-z]+)*/g;
  let last=0,m;
  while((m=re.exec(s))){
    if(m.index>last)units.push({k:'tx',b:s.slice(last,m.index)});
    const ipa=lookupIPA(m[0]);
    units.push({k:'en',b:m[0],a:ipa?ipa.ipa:'',g:ipa?!ipa.exact:false});
    last=m.index+m[0].length;
  }
  if(last<s.length)units.push({k:'tx',b:s.slice(last)});
}
function zhFallbackUnits(raw){
  const units=[];
  const re=/[\u3400-\u9fff\uf900-\ufaff]|[A-Za-z]+(?:['’][A-Za-z]+)*/g;
  let last=0,m;
  while((m=re.exec(raw))){
    if(m.index>last)units.push({k:'tx',b:raw.slice(last,m.index)});
    if(RE_ZH.test(m[0]))units.push({k:'zh',b:m[0],a:''});
    else{const ipa=lookupIPA(m[0]);units.push({k:'en',b:m[0],a:ipa?ipa.ipa:'',g:ipa?!ipa.exact:false});}
    last=m.index+m[0].length;
  }
  if(last<raw.length)units.push({k:'tx',b:raw.slice(last)});
  return units;
}

function analyzeLine(raw,genre){
  const zh=(raw.match(/[\u3400-\u9fff\uf900-\ufaff]/g)||[]).length;
  const en=(raw.match(/[A-Za-z]/g)||[]).length;

  if(zh||en)lang=(zh&&en)?'mix':(zh?'zh':'en');
  let units=[];
  if(zh>0&&PINYIN){
    let items=[];
    try{items=PINYIN(raw,{type:'all',nonZh:'consecutive',toneType:'symbol'});}catch(e){items=[];}
    if(items&&items.length){
      for(let i=0;i<items.length;i++){
        const it=items[i];
        if(it.isZh)units.push({k:'zh',b:it.origin,a:it.pinyin||''});
        else pushEnRun(units,it.origin);

  const chips=[];

    try{
      const seg=new Intl.Segmenter('zh-Hans',{granularity:'word'});
      const parts=seg.segment(raw);
      for(const p of parts){
        if(!p.isWordLike)continue;
        const t=p.segment;
        if(RE_ZH.test(t)){let py='';try{py=PINYIN(t,{toneType:'symbol'});}catch(e){}chips.push({w:t,p:py,g:false});}
        else if(/[A-Za-z]/.test(t)){const ipa=lookupIPA(t);if(ipa)chips.push({w:t,p:'/'+ipa.ipa+'/',g:!ipa.exact});}
      }
    }catch(e){}
  }else if(en>0){
    const toks=enTokens(raw);
    for(let i=0;i<toks.length;i++){const ipa=lookupIPA(toks[i].o);if(ipa)chips.push({w:toks[i].o,p:'/'+ipa.ipa+'/',g:!ipa.exact});}
  }
  const notes1=[],notes2=[];
  const toks=enTokens(raw);
  if(toks.length>=2){
    notes1.push(...matchPhrases(raw));
    if(en>=4)notes2.push(...grammarNotes(raw,toks));
  }
  if(zh>0)notes1.push(...matchChengyu(raw));
  const seen={};
  const d1=notes1.filter(n=>{const k=n.tag+n.hit;if(seen[k])return false;seen[k]=true;return true;});
  // notes3：诗词讲典故与意象，散文讲典故与修辞，歌词不出这一栏
  const notes3=[];
  if(zh>0){
    if(genre==='poem'){
      notes3.push.apply(notes3,matchAllusion(raw));
      notes3.push.apply(notes3,matchImagery(raw));
      notes3.push.apply(notes3,matchRhetoric(raw));
    }else if(genre==='prose'){
      notes3.push.apply(notes3,matchAllusion(raw));
      notes3.push.apply(notes3,matchRhetoric(raw));
    }
  }
  const seen3={};
  const d3=notes3.filter(n=>{const k=n.tag+'|'+n.hit+'|'+n.text;if(seen3[k])return false;seen3[k]=true;return true;});
  return {raw,lang,units,chips,notes1:d1,notes2:notes2.slice(0,9),notes3:d3.slice(0,8),fine:d3.length>0||isFineLine(raw)};
}

/* ================= 文体识别 ================= */
const CLASSIC_RE=/[兮矣焉哉]|不[知见闻]|何[处时人事]|无[人处限]|岂|犹|欲|莫|将|与君|吾|汝|尔|斯|其|之|乎|者|也|已|未|且|归去|相思|千里|万里|江山|风月|故人|天涯|春秋|明月/;
const CIPAI_RE=/(水调歌头|念奴娇|满江红|沁园春|如梦令|声声慢|雨霖铃|江城子|蝶恋花|浣溪沙|临江仙|菩萨蛮|清平乐|定风波|鹊桥仙|渔家傲|青玉案|扬州慢|钗头凤|一剪梅|卜算子|忆秦娥|长相思|西江月|望海潮|贺新郎|永遇乐|木兰花|采桑子|生查子|点绛唇|好事近|南乡子|摸鱼儿|虞美人|八声甘州|绝句|七律|五律|律诗|古诗|杂诗|咏怀|怀古|登高|送别|无题)/;
function detectGenre(raws,title,source){
  if(source==='POEM')return 'poem';
  const n=raws.length;
  if(!n)return 'lyric';
  let zhTotal=0,enTotal=0,lenSum=0,classic=0,casual=0,dup=0,five=0,seven=0;
  const seen={};
  for(let i=0;i<n;i++){
    const r=raws[i];
    const zh=(r.match(/[一-鿿]/g)||[]).length;
    const en=(r.match(/[A-Za-z]/g)||[]).length;
    zhTotal+=zh;enTotal+=en;lenSum+=zh;
    if(zh===5||zh===10||zh===11)five++;
    if(zh===7||zh===14||zh===15)seven++;
    if(CLASSIC_RE.test(r))classic++;
    if(CASUAL.test(r))casual++;
    if(seen[r])dup++;else seen[r]=1;
  }
  const avg=lenSum/n;
  if(enTotal>zhTotal*2)return avg>60?'prose':'lyric';
  if(avg>34)return 'prose';
  // 古典气味：命中内置典故 / 意象的行数
  let poetic=0;
  for(let i=0;i<n;i++){
    if(matchAllusion(raws[i]).length||matchImagery(raws[i]).length)poetic++;
  }
  const tidy=(five+seven)/n,poeticRate=poetic/n,hasCipai=CIPAI_RE.test(title||'');
  let score=0;
  if(tidy>=0.5)score+=2;
  if(tidy>=0.8)score+=2;
  if(poeticRate>=0.3)score+=3;
  else if(poetic>=1&&n<=8)score+=1;
  if(classic>=Math.max(2,n*0.25))score+=2;
  if(hasCipai)score+=4;
  if(avg<=9&&n<=14)score+=1;
  if(dup>=2)score-=3;
  if(casual>=Math.max(2,n*0.2))score-=4;
  if(zhTotal>0&&enTotal>zhTotal*0.25)score-=2;
  // 完全没有古典气味、又不整齐、标题也不是词牌 —— 一律不判为诗词
  if(!poetic&&!classic&&!hasCipai&&tidy<0.8)score=Math.min(score,2);
  if(score>=4)return 'poem';
  return avg>24?'prose':'lyric';
}

function summarize(lines){
  const map=new Map();
  for(let i=0;i<lines.length;i++){
    const n1=(lines[i].notes1||[]).concat(lines[i].notes3||[]);
    for(let j=0;j<n1.length;j++){
      const n=n1[j];
      const k=n.tag+'|'+n.hit+'|'+n.text;
      if(!map.has(k))map.set(k,{tag:n.tag,hit:n.hit,text:n.text,lines:[]});
      const e=map.get(k);
      if(e.lines.length<8)e.lines.push(i+1);
    }
  }
  return Array.from(map.values());
}

{t:'题都城南庄',a:'崔护',d:'唐',x:'去年今日此门中，\n人面桃花相映红。\n人面不知何处去，\n桃花依旧笑春风。'},
{t:'黄鹤楼',a:'崔颢',d:'唐',x:'昔人已乘黄鹤去，\n此地空余黄鹤楼。\n黄鹤一去不复返，\n白云千载空悠悠。\n晴川历历汉阳树，\n芳草萋萋鹦鹉洲。\n日暮乡关何处是，\n烟波江上使人愁。'},
{t:'滁州西涧',a:'韦应物',d:'唐',x:'独怜幽草涧边生，\n上有黄鹂深树鸣。\n春潮带雨晚来急，\n野渡无人舟自横。'},
{t:'登幽州台歌',a:'陈子昂',d:'唐',x:'前不见古人，\n后不见来者。\n念天地之悠悠，\n独怆然而涕下。'},
{t:'小池',a:'杨万里',d:'宋',x:'泉眼无声惜细流，\n树阴照水爱晴柔。\n小荷才露尖尖角，\n早有蜻蜓立上头。'},
{t:'晓出净慈寺送林子方',a:'杨万里',d:'宋',x:'毕竟西湖六月中，\n风光不与四时同。\n接天莲叶无穷碧，\n映日荷花别样红。'},
{t:'题西林壁',a:'苏轼',d:'宋',x:'横看成岭侧成峰，\n远近高低各不同。\n不识庐山真面目，\n只缘身在此山中。'},
{t:'饮湖上初晴后雨',a:'苏轼',d:'宋',x:'水光潋滟晴方好，\n山色空蒙雨亦奇。\n欲把西湖比西子，\n淡妆浓抹总相宜。'},
{t:'惠崇春江晚景',a:'苏轼',d:'宋',x:'竹外桃花三两枝，\n春江水暖鸭先知。\n蒌蒿满地芦芽短，\n正是河豚欲上时。'},
{t:'水调歌头·明月几时有',a:'苏轼',d:'宋',x:'明月几时有，\n把酒问青天。\n不知天上宫阙，\n今夕是何年。\n我欲乘风归去，\n又恐琼楼玉宇，\n高处不胜寒。\n起舞弄清影，\n何似在人间。\n转朱阁，低绮户，照无眠。\n不应有恨，\n何事长向别时圆。\n人有悲欢离合，\n月有阴晴圆缺，\n此事古难全。\n但愿人长久，\n千里共婵娟。'},
{t:'念奴娇·赤壁怀古',a:'苏轼',d:'宋',x:'大江东去，\n浪淘尽，千古风流人物。\n故垒西边，\n人道是，三国周郎赤壁。\n乱石穿空，\n惊涛拍岸，\n卷起千堆雪。\n江山如画，\n一时多少豪杰。\n遥想公瑾当年，\n小乔初嫁了，\n雄姿英发。\n羽扇纶巾，\n谈笑间，樯橹灰飞烟灭。\n故国神游，\n多情应笑我，\n早生华发。\n人生如梦，\n一尊还酹江月。'},
{t:'江城子·乙卯正月二十日夜记梦',a:'苏轼',d:'宋',x:'十年生死两茫茫，\n不思量，自难忘。\n千里孤坟，\n无处话凄凉。\n纵使相逢应不识，\n尘满面，鬓如霜。\n夜来幽梦忽还乡，\n小轩窗，正梳妆。\n相顾无言，\n惟有泪千行。\n料得年年肠断处，\n明月夜，短松冈。'},
{t:'定风波·莫听穿林打叶声',a:'苏轼',d:'宋',x:'莫听穿林打叶声，\n何妨吟啸且徐行。\n竹杖芒鞋轻胜马，\n谁怕，\n一蓑烟雨任平生。\n料峭春风吹酒醒，\n微冷，\n山头斜照却相迎。\n回首向来萧瑟处，\n归去，\n也无风雨也无晴。'},
{t:'声声慢·寻寻觅觅',a:'李清照',d:'宋',x:'寻寻觅觅，\n冷冷清清，\n凄凄惨惨戚戚。\n乍暖还寒时候，\n最难将息。\n三杯两盏淡酒，\n怎敌他晚来风急。\n雁过也，\n正伤心，\n却是旧时相识。\n满地黄花堆积，\n憔悴损，\n如今有谁堪摘。\n守着窗儿，\n独自怎生得黑。\n梧桐更兼细雨，\n到黄昏点点滴滴。\n这次第，\n怎一个愁字了得。'},
{t:'如梦令·昨夜雨疏风骤',a:'李清照',d:'宋',x:'昨夜雨疏风骤，\n浓睡不消残酒。\n试问卷帘人，\n却道海棠依旧。\n知否，知否，\n应是绿肥红瘦。'},
{t:'一剪梅·红藕香残玉簟秋',a:'李清照',d:'宋',x:'红藕香残玉簟秋，\n轻解罗裳，\n独上兰舟。\n云中谁寄锦书来，\n雁字回时，\n月满西楼。\n花自飘零水自流。\n一种相思，\n两处闲愁。\n此情无计可消除，\n才下眉头，\n却上心头。'},
{t:'夏日绝句',a:'李清照',d:'宋',x:'生当作人杰，\n死亦为鬼雄。\n至今思项羽，\n不肯过江东。'},
{t:'虞美人·春花秋月何时了',a:'李煜',d:'五代',x:'春花秋月何时了，\n往事知多少。\n小楼昨夜又东风，\n故国不堪回首月明中。\n雕栏玉砌应犹在，\n只是朱颜改。\n问君能有几多愁，\n恰似一江春水向东流。'},
{t:'相见欢·无言独上西楼',a:'李煜',d:'五代',x:'无言独上西楼，\n月如钩。\n寂寞梧桐深院锁清秋。\n剪不断，\n理还乱，\n是离愁。\n别是一般滋味在心头。'},
{t:'浪淘沙令·帘外雨潺潺',a:'李煜',d:'五代',x:'帘外雨潺潺，\n春意阑珊。\n罗衾不耐五更寒。\n梦里不知身是客，\n一晌贪欢。\n独自莫凭栏，\n无限江山。\n别时容易见时难。\n流水落花春去也，\n天上人间。'},
{t:'雨霖铃·寒蝉凄切',a:'柳永',d:'宋',x:'寒蝉凄切，\n对长亭晚，\n骤雨初歇。\n都门帐饮无绪，\n留恋处，兰舟催发。\n执手相看泪眼，\n竟无语凝噎。\n念去去，千里烟波，\n暮霭沉沉楚天阔。\n多情自古伤离别，\n更那堪冷落清秋节。\n今宵酒醒何处，\n杨柳岸晓风残月。\n此去经年，\n应是良辰好景虚设。\n便纵有千种风情，\n更与何人说。'},
{t:'蝶恋花·伫倚危楼风细细',a:'柳永',d:'宋',x:'伫倚危楼风细细，\n望极春愁，\n黯黯生天际。\n草色烟光残照里，\n无言谁会凭阑意。\n拟把疏狂图一醉，\n对酒当歌，\n强乐还无味。\n衣带渐宽终不悔，\n为伊消得人憔悴。'},
{t:'青玉案·元夕',a:'辛弃疾',d:'宋',x:'东风夜放花千树。\n更吹落、星如雨。\n宝马雕车香满路。\n凤箫声动，\n玉壶光转，\n一夜鱼龙舞。\n蛾儿雪柳黄金缕，\n笑语盈盈暗香去。\n众里寻他千百度。\n蓦然回首，\n那人却在，\n灯火阑珊处。'},
{t:'破阵子·为陈同甫赋壮词以寄之',a:'辛弃疾',d:'宋',x:'醉里挑灯看剑，\n梦回吹角连营。\n八百里分麾下炙，\n五十弦翻塞外声。\n沙场秋点兵。\n马作的卢飞快，\n弓如霹雳弦惊。\n了却君王天下事，\n赢得生前身后名。\n可怜白发生。'},
{t:'丑奴儿·书博山道中壁',a:'辛弃疾',d:'宋',x:'少年不识愁滋味，\n爱上层楼。\n爱上层楼。\n为赋新词强说愁。\n而今识尽愁滋味，\n欲说还休。\n欲说还休。\n却道天凉好个秋。'},
{t:'满江红·写怀',a:'岳飞',d:'宋',x:'怒发冲冠，\n凭阑处、潇潇雨歇。\n抬望眼，\n仰天长啸，\n壮怀激烈。\n三十功名尘与土，\n八千里路云和月。\n莫等闲、白了少年头，\n空悲切。\n靖康耻，犹未雪。\n臣子恨，何时灭。\n驾长车，\n踏破贺兰山缺。\n壮志饥餐胡虏肉，\n笑谈渴饮匈奴血。\n待从头、收拾旧山河，\n朝天阙。'},
{t:'过零丁洋',a:'文天祥',d:'宋',x:'辛苦遭逢起一经，\n干戈寥落四周星。\n山河破碎风飘絮，\n身世浮沉雨打萍。\n惶恐滩头说惶恐，\n零丁洋里叹零丁。\n人生自古谁无死，\n留取丹心照汗青。'},
{t:'示儿',a:'陆游',d:'宋',x:'死去元知万事空，\n但悲不见九州同。\n王师北定中原日，\n家祭无忘告乃翁。'},
{t:'游山西村',a:'陆游',d:'宋',x:'莫笑农家腊酒浑，\n丰年留客足鸡豚。\n山重水复疑无路，\n柳暗花明又一村。\n箫鼓追随春社近，\n衣冠简朴古风存。\n从今若许闲乘月，\n拄杖无时夜叩门。'},
{t:'卜算子·咏梅',a:'陆游',d:'宋',x:'驿外断桥边，\n寂寞开无主。\n已是黄昏独自愁，\n更著风和雨。\n无意苦争春，\n一任群芳妒。\n零落成泥碾作尘，\n只有香如故。'},
{t:'泊船瓜洲',a:'王安石',d:'宋',x:'京口瓜洲一水间，\n钟山只隔数重山。\n春风又绿江南岸，\n明月何时照我还。'},
{t:'梅花',a:'王安石',d:'宋',x:'墙角数枝梅，\n凌寒独自开。\n遥知不是雪，\n为有暗香来。'},
{t:'元日',a:'王安石',d:'宋',x:'爆竹声中一岁除，\n春风送暖入屠苏。\n千门万户曈曈日，\n总把新桃换旧符。'},
{t:'己亥杂诗',a:'龚自珍',d:'清',x:'浩荡离愁白日斜，\n吟鞭东指即天涯。\n落红不是无情物，\n化作春泥更护花。'},
{t:'观沧海',a:'曹操',d:'汉',x:'东临碣石，以观沧海。\n水何澹澹，山岛竦峙。\n树木丛生，百草丰茂。\n秋风萧瑟，洪波涌起。\n日月之行，若出其中。\n星汉灿烂，若出其里。\n幸甚至哉，歌以咏志。'},
{t:'龟虽寿',a:'曹操',d:'汉',x:'神龟虽寿，犹有竟时。\n螣蛇乘雾，终为土灰。\n老骥伏枥，志在千里。\n烈士暮年，壮心不已。\n盈缩之期，不但在天。\n养怡之福，可得永年。\n幸甚至哉，歌以咏志。'},
{t:'饮酒·其五',a:'陶渊明',d:'晋',x:'结庐在人境，\n而无车马喧。\n问君何能尔，\n心远地自偏。\n采菊东篱下，\n悠然见南山。\n山气日夕佳，\n飞鸟相与还。\n此中有真意，\n欲辨已忘言。'},
{t:'敕勒歌',a:'北朝民歌',d:'南北朝',x:'敕勒川，阴山下。\n天似穹庐，笼盖四野。\n天苍苍，野茫茫，\n风吹草低见牛羊。'},
{t:'天净沙·秋思',a:'马致远',d:'元',x:'枯藤老树昏鸦，\n小桥流水人家，\n古道西风瘦马。\n夕阳西下，\n断肠人在天涯。'},
{t:'秋思',a:'张籍',d:'唐',x:'洛阳城里见秋风，\n欲作家书意万重。\n复恐匆匆说不尽，\n行人临发又开封。'},
{t:'鹊桥仙·纤云弄巧',a:'秦观',d:'宋',x:'纤云弄巧，\n飞星传恨，\n银汉迢迢暗度。\n金风玉露一相逢，\n便胜却人间无数。\n柔情似水，\n佳期如梦，\n忍顾鹊桥归路。\n两情若是久长时，\n又岂在朝朝暮暮。'},
{t:'木兰花·拟古决绝词柬友',a:'纳兰性德',d:'清',x:'人生若只如初见，\n何事秋风悲画扇。\n等闲变却故人心，\n却道故人心易变。\n骊山语罢清宵半，\n泪雨霖铃终不怨。\n何如薄幸锦衣郎，\n比翼连枝当日愿。'}
];
function searchPoems(q){
  q=(q||'').trim();
  if(!q)return [];
  const key=q.replace(/[\s·、，,。《》〈〉「」"'']/g,'');
  if(!key)return [];
  const out=[];
  for(let i=0;i<POEMS.length;i++){
    const p=POEMS[i];
    const flat=(p.t+p.a+p.d+p.x).replace(/[\s，。、！？；：「」《》·\n]/g,'');
    const tt=p.t.replace(/[·\s]/g,'');
    let score=0;
    if(tt===key)score=100;
    else if(tt.indexOf(key)>=0)score=80;
    else if(key.indexOf(tt)>=0&&tt.length>=2)score=70;
    else if(p.a===key)score=60;
    else if(flat.indexOf(key)>=0&&key.length>=2)score=40;
    if(score)out.push({score:score,poem:p});
  }
  out.sort((a,b)=>b.score-a.score);
  return out.slice(0,12).map(o=>o.poem);
}

function midiFreq(m){return 440*Math.pow(2,(m-69)/12);}
function makeReverb(ctx,seconds,decay){
  const sr=ctx.sampleRate,len=Math.max(1,Math.floor(sr*seconds));
  const buf=ctx.createBuffer(2,len,sr);
  for(let c=0;c<2;c++){
    const d=buf.getChannelData(c);
    for(let i=0;i<len;i++){
      const t=i/len;
      d[i]=(Math.random()*2-1)*Math.pow(1-t,decay)*(1-t*0.2);
    }
  }
  const cv=ctx.createConvolver();cv.buffer=buf;return cv;
}
/* Karplus-Strong 拨弦 */
function pluckBuffer(ctx,freq,dur,bright,damp){
  const key=Math.round(freq)+'_'+Math.round(dur*10)+'_'+bright+'_'+damp;
  if(AUDIO.buffers[key])return AUDIO.buffers[key];
  const sr=ctx.sampleRate,N=Math.max(64,Math.round(sr*dur));
  const buf=ctx.createBuffer(1,N,sr);
  const out=buf.getChannelData(0);
  const L=Math.max(2,Math.round(sr/freq));
  const line=new Float32Array(L);
  let last=0;
  for(let i=0;i<L;i++){
    const w=Math.random()*2-1;
    last=last+(w-last)*bright;
    line[i]=last;
  }
  let idx=0,lp=0;
  for(let i=0;i<N;i++){
    const cur=line[idx];
    out[i]=cur;
    const nxt=line[(idx+1)%L];
    lp=lp+((cur+nxt)*0.5-lp)*0.85;
    line[idx]=lp*damp;
    idx=(idx+1)%L;
  }
  const fade=Math.min(N,Math.floor(sr*0.25));
  for(let i=0;i<fade;i++)out[N-fade+i]*=(1-i/fade);
  AUDIO.buffers[key]=buf;
  return buf;
}

  const ctx=AUDIO.ctx;

  src.buffer=pluckBuffer(ctx,freq,dur,cfg.bright,cfg.damp);
  const g=ctx.createGain();
  g.gain.setValueAtTime(0,t);

  const f=ctx.createBiquadFilter();

  f.frequency.setValueAtTime(cfg.cut*(0.7+vel*0.6),t);
  src.connect(f);f.connect(g);g.connect(AUDIO.dry);g.connect(AUDIO.revGain);
  src.start(t);src.stop(t+dur+0.05);
}

function playWind(t,freq,dur,vel,cfg){
  const ctx=AUDIO.ctx;
  const g=ctx.createGain();
  const a=cfg.attack,r=Math.min(0.4,dur*0.4);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vel),t+a);
  g.gain.setValueAtTime(Math.max(0.0002,vel),t+Math.max(a,dur-r));
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  // 颤音
  const lfo=ctx.createOscillator();lfo.type='sine';lfo.frequency.setValueAtTime(cfg.vibHz,t);
  const lg=ctx.createGain();lg.gain.setValueAtTime(0,t);
  lg.gain.linearRampToValueAtTime(freq*cfg.vib,t+Math.min(dur*0.55,0.45));
  lfo.connect(lg);
  const oscs=[];
  for(let i=0;i<cfg.harm.length;i++){
    const amp=cfg.harm[i];
    if(amp<=0)continue;
    const o=ctx.createOscillator();
    o.type=(i===0?'sine':(i===1?'triangle':'sine'));
    o.frequency.setValueAtTime(freq*(i+1),t);
    if(i===0){ // 起音的小上滑，像吹管的“送气”
      o.frequency.setValueAtTime(freq*0.985,t);
      o.frequency.exponentialRampToValueAtTime(freq,t+a*0.85);
    }
    const og=ctx.createGain();og.gain.value=amp;
    lg.connect(o.frequency);
    o.connect(og);og.connect(g);
    o.start(t);o.stop(t+dur+0.1);
    oscs.push(o);
  }
  // 气声
  const nb=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*Math.max(0.1,dur)),ctx.sampleRate);
  const nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++)nd[i]=(Math.random()*2-1);
  const ns=ctx.createBufferSource();ns.buffer=nb;

      }
      t+=d;total+=d;
    }
    AUDIO.timer=setTimeout(scheduleLoopSynth,(total+2.6)*1000-140);
    return;
  }
  const scale=SCALES[T.mode],beat=60/T.bpm;
  const bank=PHRASE_LIB[T.ph]||PHRASE_LIB.qinKong;
  const ph=bank[AUDIO.phraseIdx%bank.length];
  AUDIO.phraseIdx=(AUDIO.phraseIdx+1+(Math.random()<0.3?1:0))%bank.length;
  const oct=(Math.random()<0.18)?12:0;
  for(let i=0;i<ph.length;i++){
    const step=ph[i][0],d=ph[i][1]*beat;
    if(step!==null){
      const deg=((step%5)+5)%5,up=Math.floor(step/5)*12;
      const midi=T.root+scale[deg]+up+oct;
      const vel=ins.vel*(0.72+Math.random()*0.42)*(T.gain||1);
      const dur=Math.min(ins.type==='pluck'?ins.dur:d*1.02,d*(ins.type==='pluck'?3.2:1.02));
      if(ins.type==='pluck'){

      }else playWind(t,midiFreq(midi),Math.max(.28,dur),vel,ins);
    }
    t+=d;total+=d;
  }
  if(T.bell&&Math.random()<0.5)playBell(ctx.currentTime+total*0.55,midiFreq(T.root-12),0.11);
  const gapBeats=2+Math.floor(Math.random()*3);
  AUDIO.timer=setTimeout(scheduleLoopSynth,(total+gapBeats*beat)*1000-140);
}
/* ================= 场景配乐 v2：真实乐器采样 + 按意境编配 =================
   为什么旧版“机械”：只有一条合成旋律、节拍卡死在格子上、三句乐句来回循环、没有伴奏和环境声。
   新版每个场景是一套“编配”：
     主奏（古琴/古筝/琵琶/笛/箫，真实采样）+ 伴奏（低音、分解和弦、长音垫底）
     + 环境声（虫鸣、鸟、风、雨、溪水、江浪、檐滴）+ 点缀（寺钟、木鱼、战鼓、泛音）
   演奏上加了：滑音（绰注）、吟猱（慢颤）、按滑、刮奏、轮指、倚音、句尾渐慢、句内强弱起伏、留白。

const SAMP_OF={qin:'qin',zheng:'zheng',pipa:'zheng',di:'di',xiao:'xiao'};

const SAMP={loading:null,buf:{},noise:null};

function loadSampleScript(){
  if(window.ART_SAMPLES)return Promise.resolve(true);

    const s=document.createElement('script');s.src='sounds.js';

function b64ToAB(b64){const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer;}
function decodeIns(ctx,ins){
  const key=ins;
  if(SAMP.buf[key]&&SAMP.buf[key].ctx===ctx)return SAMP.buf[key].ready;
  const src=window.ART_SAMPLES&&window.ART_SAMPLES[ins];
  if(!src)return Promise.resolve(false);
  const o={ctx:ctx,notes:{},keys:[],ready:null};SAMP.buf[key]=o;
  o.ready=Promise.all(Object.keys(src).map(k=>new Promise(r=>{
    try{ctx.decodeAudioData(b64ToAB(src[k]),b=>{o.notes[+k]=b;r();},()=>r());}catch(e){r();}
  }))).then(()=>{o.keys=Object.keys(o.notes).map(Number).sort((a,b)=>a-b);return o.keys.length>0;});
  return o.ready;
}
function noiseBuf(ctx){
  if(SAMP.noise&&SAMP.noise.ctx===ctx)return SAMP.noise.b;
  const len=ctx.sampleRate*4,b=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);let p=0;
    for(let i=0;i<len;i++){const w=Math.random()*2-1;p=0.97*p+0.03*w;d[i]=w*0.6+p*3.2;}}   // 白噪 + 一点低频，接近粉噪
  SAMP.noise={ctx:ctx,b:b};return b;
}
function mulberry(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function gauss(r){return (r()+r()+r()-1.5)/1.5;}

/* ---------- 发声 ---------- */
function sVoice(S,ins,t,midi,o){
  const ctx=S.ctx,B=SAMP.buf[ins];
  if(!B||!B.keys.length)return;
  let best=B.keys[0];for(const k of B.keys)if(Math.abs(k-midi)<Math.abs(best-midi))best=k;
  const buf=B.notes[best];
  const src=ctx.createBufferSource();src.buffer=buf;
  const cents=(midi-best)*100;
  const wind=(ins==='di'||ins==='xiao');
  if(o.bendFrom){src.detune.setValueAtTime(cents+o.bendFrom*100,t);src.detune.linearRampToValueAtTime(cents,t+(o.bendTime||.16));}
  else src.detune.setValueAtTime(cents,t);
  if(o.bendTo){                               // 按滑：拨弦后把音推上去再回来
    src.detune.setValueAtTime(cents,t+o.bendAt);
    src.detune.linearRampToValueAtTime(cents+o.bendTo*100,t+o.bendAt+.14);
    if(o.bendBack)src.detune.linearRampToValueAtTime(cents,t+o.bendAt+.5);
  }
  const dur=Math.max(.08,o.dur);
  if(wind&&dur>buf.duration-.3){src.loop=true;src.loopStart=.9;src.loopEnd=buf.duration-.35;}
  if(o.vib){                                  // 吟猱 / 气颤
    const lfo=ctx.createOscillator();lfo.frequency.value=o.vibHz||4.5;
    const lg=ctx.createGain();lg.gain.setValueAtTime(0,t);
    lg.gain.linearRampToValueAtTime(0,t+(o.vibDelay||.25));
    lg.gain.linearRampToValueAtTime(o.vib,t+(o.vibDelay||.25)+.35);
    lfo.connect(lg);lg.connect(src.detune);lfo.start(t);lfo.stop(t+dur+.6);
  }
  const g=ctx.createGain(),att=o.att||.004,rel=o.rel||(wind?.18:.45);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(o.vel,t+att);
  if(wind){g.gain.setValueAtTime(o.vel,t+Math.max(att,dur-rel));g.gain.linearRampToValueAtTime(0.0001,t+dur);}
  else{g.gain.setValueAtTime(o.vel,t+Math.max(att,dur-rel));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);}
  let node=src;
  if(o.cut){const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=o.cut;f.Q.value=.5;node.connect(f);node=f;}
  node.connect(g);
  const pn=ctx.createStereoPanner?ctx.createStereoPanner():null;
  if(pn){pn.pan.value=o.pan||0;g.connect(pn);pn.connect(S.bus);pn.connect(S.send);}
  else{g.connect(S.bus);g.connect(S.send);}
  src.start(t);src.stop(t+dur+.05);
}
function sHarm(S,t,midi,vel,pan){              // 古琴泛音：清亮如钟
  const ctx=S.ctx,f=midiFreq(midi);
  [[1,1],[2,.25],[3,.08]].forEach(([m,a])=>{
    const o=ctx.createOscillator();o.type='sine';o.frequency.value=f*m;
    const g=ctx.createGain();g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vel*a,t+.006);g.gain.exponentialRampToValueAtTime(0.0001,t+2.8/m);
    const p=ctx.createStereoPanner?ctx.createStereoPanner():null;
    o.connect(g);if(p){p.pan.value=pan||0;g.connect(p);p.connect(S.bus);p.connect(S.send);}else{g.connect(S.bus);g.connect(S.send);}
    o.start(t);o.stop(t+3);
  });
}
function sBell(S,t,midi,vel){
  const ctx=S.ctx,f=midiFreq(midi),parts=[1,2.76,5.4,8.9],amps=[1,.42,.2,.1];
  for(let i=0;i<parts.length;i++){
    const o=ctx.createOscillator();o.type='sine';o.frequency.value=f*parts[i];
    const g=ctx.createGain();g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vel*amps[i],t+.012);g.gain.exponentialRampToValueAtTime(0.0001,t+7-i*1.2);
    o.connect(g);g.connect(S.bus);g.connect(S.send);o.start(t);o.stop(t+7.2);
  }
}
function sPerc(S,ins,t,midi,vel,cut,pan){sVoice(S,ins,t,midi,{vel:vel,dur:ins==='gu'?1.7:.55,cut:cut,pan:pan||0,rel:.3});}

/* ---------- 环境声 ---------- */
function ambStart(S,amb){
  const ctx=S.ctx,t=ctx.currentTime,nb=noiseBuf(ctx);S.ambNodes=[];S.ambState={};
  const loop=(filters,level)=>{
    const src=ctx.createBufferSource();src.buffer=nb;src.loop=true;
    src.loopStart=Math.random()*2;src.loopEnd=src.loopStart+1.8;
    let node=src;filters.forEach(f=>{node.connect(f);node=f;});
    const g=ctx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(level,t+3);
    node.connect(g);g.connect(S.amb);src.start(t,Math.random()*3);S.ambNodes.push(src);return {g:g,filters:filters,level:level};
  };
  const bq=(type,f,q)=>{const b=ctx.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q||.7;return b;};
  if(amb.wind)S.ambState.wind=loop([bq('bandpass',520,.55),bq('lowpass',1600)],amb.wind*.08);
  if(amb.rain)S.ambState.rain=loop([bq('highpass',1600),bq('lowpass',5200)],amb.rain*.018);
  if(amb.stream)S.ambState.stream=loop([bq('bandpass',1400,2.2),bq('peaking',2600,1.5)],amb.stream*.16);
  if(amb.waves)S.ambState.waves=loop([bq('lowpass',460,.6)],amb.waves*.2);
  if(amb.lap)S.ambState.lap=loop([bq('bandpass',650,.9)],amb.lap*.08);
  S.ambNext={};
}
function ambStop(S){
  (S.ambNodes||[]).forEach(n=>{try{n.stop(S.ctx.currentTime+1.4);}catch(e){}});
}
function chirp(S,t,f0,f1,dur,vel,pan,type){
  const ctx=S.ctx,o=ctx.createOscillator();o.type=type||'sine';
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=ctx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vel,t+dur*.25);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  const p=ctx.createStereoPanner?ctx.createStereoPanner():null;
  o.connect(g);if(p){p.pan.value=pan;g.connect(p);p.connect(S.amb);}else g.connect(S.amb);
  o.start(t);o.stop(t+dur+.02);
}
function ambPlan(S,t0,t1){
  const A=S.sc.amb||{},r=S.rng2,st=S.ambState,nx=S.ambNext;
  const due=(k,first)=>{if(nx[k]===undefined)nx[k]=t0+first;return nx[k]<t1;};
  // 风：阵阵起伏
  if(st.wind)while(due('wind',0)){const t=nx.wind,lv=st.wind.level*(.35+r()*.9);
    st.wind.g.gain.setTargetAtTime(lv,t,1.6);st.wind.filters[0].frequency.setTargetAtTime(320+r()*520,t,2.2);nx.wind+=2.5+r()*4;}
  if(st.waves)while(due('waves',0)){const t=nx.waves,lv=st.waves.level;
    st.waves.g.gain.setTargetAtTime(lv*(1+r()*.5),t,1.2);st.waves.g.gain.setTargetAtTime(lv*.35,t+3.2,1.6);nx.waves+=5.5+r()*3.5;}
  if(st.lap)while(due('lap',0)){const t=nx.lap,lv=st.lap.level;
    st.lap.g.gain.setTargetAtTime(lv*(1.2+r()),t,.25);st.lap.g.gain.setTargetAtTime(lv*.3,t+.6,.4);nx.lap+=1.4+r()*2.2;}
  if(st.stream)while(due('stream',0)){const t=nx.stream;       // 溪水：滤波频率快速乱跳 = 咕噜声
    st.stream.filters[0].frequency.setTargetAtTime(900+r()*1500,t,.03);st.stream.filters[1].frequency.setTargetAtTime(1800+r()*2200,t,.04);nx.stream+=.06+r()*.07;}
  if(A.rain)while(due('rain',0)){const t=nx.rain;              // 雨点
    chirp(S,t,2200+r()*2600,1200+r()*800,.018,A.rain*.035*(.4+r()),r()*1.6-.8,'triangle');nx.rain+=.03+r()*.12;}
  if(A.drip)while(due('drip',1+r()*2)){const t=nx.drip;          // 檐滴
    chirp(S,t,700+r()*300,1900+r()*700,.07,A.drip*.09,r()*1.2-.6);nx.drip+=1.2+r()*3.2;}
  if(A.crickets)for(let c=0;c<2;c++){const k='cr'+c;              // 虫鸣：两只蟋蟀一左一右
    while(due(k,r()*1.5)){let t=nx[k];const f=4300+c*380+r()*60,pan=c?.55:-.5,n=3+Math.floor(r()*2);
      for(let i=0;i<n;i++)chirp(S,t+i*.052,f,f*1.01,.024,A.crickets*.04,pan);
      nx[k]+=(r()<.12)?(2.5+r()*4):(.55+r()*.5);}}

    const base=2300+r()*1500,n=2+Math.floor(r()*4),pan=r()*1.4-.7,up=r()<.5;
    for(let i=0;i<n;i++){const d=.06+r()*.09,f0=base*(1+(r()-.5)*.25);

/* ---------- 作曲 ---------- */
const RHY={
  slow:[[2,1,1,4],[1,1,2,2,4],[3,1,2,4],[2,2,1,1,4],[1,2,1,2,4],[2,1,1,2,4]],
  mid: [[1,1,2,1,1,2],[1,.5,.5,2,1,1,2],[2,1,1,2,2],[1,1,1,1,2,2],[1.5,.5,1,1,2,2]],
  fast:[[.5,.5,1,.5,.5,1,2],[1,.5,.5,1,1,2],[.5,.5,.5,.5,1,1,2],[1,1,.5,.5,1,2]]
};
function genPhrase(r,rhy,start,end,lo,hi){
  const n=rhy.length,s=[start];
  for(let i=1;i<n-1;i++){
    const pos=i/(n-1),up=pos<.55?.68:.32,x=r();
    let st=x<.16?0:(x<.8?1:(x<.95?2:3));
    let v=s[i-1]+(r()<up?st:-st);
    if(v<lo)v=lo+1;if(v>hi)v=hi-1;s.push(v);
  }
  if(n>1){                                   // 以级进收到落音
    if(Math.abs(s[n-2]-end)>2)s[n-2]=end+(s[n-2]>end?1:-1);
    s.push(end);
  }
  return s;
}
function degMidi(root,scale,step){const d=((step%5)+5)%5,o=Math.floor(step/5);return root+scale[d]+12*o;}

/* 一句：把音级 + 节奏落到时间轴上，带演奏法 */
function playLine(S,notes,t,beat,opt){
  const sc=S.sc,T=S.tune,lead=sc.lead,ins=SAMP_OF[lead],orn=sc.orn||{},r=S.rng;
  const n=notes.length;let tt=t;
  const base=(LEAD_VEL[lead]||1.2)*(opt.vel||1)*(T.gain||1);
  for(let i=0;i<n;i++){
    const nt=notes[i];let d=nt.d*beat;
    const pos=n>1?i/(n-1):0;
    d*=1+.14*Math.pow(pos,3);                 // 句尾渐慢
    if(i===n-1)d*=1.25;
    if(nt.m===null){tt+=d;continue;}
    const at=tt+gauss(r)*.014+(i===0?.04:0);
    const vel=base*(.62+.38*Math.sin(Math.PI*(.15+pos*.7)))*(.9+r()*.2);   // 句内起伏
    const m=nt.m;
    if(lead==='qin'){
      const o={vel:vel,dur:Math.min(2.8,Math.max(1.1,d*2.2)),cut:2300,pan:.05,rel:.6};
      if(r()<(orn.slide||0))Object.assign(o,{bendFrom:r()<.7?-2:2,bendTime:.14+r()*.12});     // 绰 / 注
      if(d>beat*1.4&&r()<(orn.vib||0))Object.assign(o,{vib:14+r()*14,vibHz:3.2+r()*1.5,vibDelay:.35});  // 吟猱
      sVoice(S,ins,at,m,o);
    }else if(lead==='zheng'||lead==='pipa'){
      const hi=lead==='pipa';
      const trem=d>=(hi?.55:.9)&&r()<(orn.trem||0);
      if(trem){                                // 摇指 / 轮指
        const gap=hi?.055:.075,k=Math.floor(d*.9/gap);
        for(let j=0;j<k;j++)sVoice(S,ins,at+j*gap,m,{vel:vel*(j?(.5+.2*(j%2)):1)*(1-.3*j/k),dur:.35,cut:hi?6000:4200,pan:.08,rel:.2});
      }else{
        const o={vel:vel,dur:Math.min(2.3,Math.max(.6,d*2.4)),cut:hi?6500:4800,pan:.08,rel:.4};
        if(!hi&&d>beat*.9&&r()<(orn.bend||0))Object.assign(o,{bendTo:r()<.6?2:1,bendAt:Math.min(.45,d*.45),bendBack:r()<.6});
        sVoice(S,ins,at,m,o);
        if(hi&&i===0&&r()<(orn.strum||0)){[m-5,m-12].forEach((mm,j)=>sVoice(S,ins,at+.018*(j+1),mm,{vel:vel*.6,dur:.9,cut:5000,pan:-.1}));}
      }
    }else{                                     // 笛 / 箫
      const flute=lead==='di';
      if(flute&&r()<(orn.grace||0)&&d>beat*.45){               // 倚音
        sVoice(S,ins,at-.07,m+(r()<.6?2:3),{vel:vel*.7,dur:.09,att:.01,rel:.03,pan:.05});
      }
      const o={vel:vel*(flute?.95:1),dur:d*.97,att:flute?.035:.12,rel:flute?.1:.22,pan:.05,

      if(r()<(orn.slide||0))Object.assign(o,{bendFrom:-1,bendTime:.18});
      sVoice(S,ins,at,m,o);
      if(sc.echo&&i===n-1)sVoice(S,ins,at+d*.55,m+12,{vel:vel*.22,dur:d*.8,att:.2,rel:.3,pan:-.4});   // 远山回声
    }

  }

}
/* 伴奏：低音 / 分解和弦 / 长音垫底 */
function playAcc(S,t,len,beat,rootM,scale){
  const sc=S.sc,r=S.rng;
  if(sc.acc==='drone'){
    const ins=SAMP_OF[sc.accIns||'qin'];
    for(let x=0;x<len-.2;x+=beat*4){
      sVoice(S,ins,t+x,rootM-12,{vel:.55,dur:2.6,cut:1300,pan:-.3,rel:.8});
      if(r()<.6)sVoice(S,ins,t+x+beat*2,rootM-5,{vel:.36,dur:2.2,cut:1400,pan:-.3,rel:.7});
    }
  }else if(sc.acc==='arp'){
    const ins=SAMP_OF[sc.accIns||'zheng'],step=beat>.9?beat:beat/2;
    const pat=[0,3,5,3,1,3,5,6];
    let k=0;
    for(let x=0;x<len-.1;x+=step){
      const m=degMidi(rootM-12,scale,pat[k%pat.length]);
      sVoice(S,ins,t+x+gauss(r)*.01,m,{vel:.34*(k%4===0?1.25:1),dur:1.6,cut:3200,pan:-.32,rel:.5});k++;
    }
  }
  if(sc.pad){                                  // 长音垫底
    const ins=SAMP_OF[sc.pad];
    sVoice(S,ins,t+.1,rootM+(r()<.5?0:7)-(sc.pad==='xiao'?0:0),{vel:.16,dur:Math.min(len,7),att:.9,rel:1.2,pan:.35,vib:8,vibHz:4});
  }
}
function playGliss(S,t,rootM,scale,up){       // 刮奏
  const ins=SAMP_OF[S.sc.lead],n=11;
  for(let i=0;i<n;i++){const st=up?i-3:8-i;sVoice(S,ins,t+i*.034,degMidi(rootM,scale,st),{vel:.22+.4*i/n,dur:1.2,cut:5000,pan:-.2+.4*i/n});}

}
function playPercBar(S,t,len,beat){
  const p=S.sc.perc||{},r=S.rng;
  if(p.muyu){                                  // 木鱼：禅寺稳稳地敲，田园/酒歌轻快
    const fast=S.sc.lead!=='qin';
    for(let x=0;x<len-.05;x+=fast?beat:beat*2){if(r()<.92)sPerc(S,'muyu',t+x,fast&&((x/beat)%2)?74:67,p.muyu*.9*(fast?.7:1),3000,.2);}
  }
  if(p.gu){                                    // 鼓：边塞远鼓 / 慷慨战鼓
    if(p.gu>.5){for(let x=0;x<len-.05;x+=beat*2){sPerc(S,'gu',t+x,38,p.gu*1.1,900,-.1);if(r()<.55)sPerc(S,'gu',t+x+beat*1.5,45,p.gu*.6,1100,.1);}}

/* 一整轮：起句—答句 → 间奏 → 变奏 → 留白 */
function conductCycle(S,t){
  const T=S.tune,sc=S.sc,r=S.rng=mulberry(S.seed+S.cyc*7919);
  const lead=sc.lead;
  let rootM=T.root;
  if(lead==='di'&&rootM<64)rootM+=12;
  if(lead==='pipa'&&rootM<60)rootM+=12;
  const scale=SCALES[T.mode||'gong'];
  const bpm=T.bpm||(T.mel?60/MELODY[T.mel].beat:60);
  const beat=T.mel?60/bpm:60/Math.max(bpm,lead==='qin'?54:48);   // 太慢会变成一个个孤立的音
  let x=0;
  // 开场或新一轮的引子
  if(S.cyc===0&&(sc.orn||{}).gliss)x+=playGliss(S,t+.4,rootM,scale,true)+.4;
  else if(S.cyc===0)x+=1.2;
  const useMel=T.mel&&(S.cyc%2===0);
  if(sc.perc&&sc.perc.bell&&r()<.9)sBell(S,t+x,rootM-12,.09*sc.perc.bell);
  if(useMel){
    const M=MELODY[T.mel],mb=M.beat*(1.02+r()*.06),up=(S.cyc%4===2)?12:0;
    const notes=M.notes.map(([s,d])=>({m:s===null?null:rootM+jianpuSemi(s)+up,d:d}));
    const len=notes.reduce((a,b)=>a+b.d*mb,0)*1.06;
    playAcc(S,t+x,len,mb*2,rootM,scale);playPercBar(S,t+x,len,mb*2);
    x+=playLine(S,notes,t+x,mb,{vel:1});
  }else{
    const cls=bpm>=80?'fast':(bpm>=50||lead==='di'?'mid':'slow');
    const R=RHY[cls],ra=R[Math.floor(r()*R.length)],rb=R[Math.floor(r()*R.length)];
    const lo=-2,hi=8,st=[0,2,3,5][Math.floor(r()*4)];
    const a=genPhrase(r,ra,st,r()<.5?3:1,lo,hi);
    // 答句：借起句前半的动机，换一个落在主音上的结尾
    const half=Math.max(2,Math.floor(ra.length/2));
    let b=a.slice(0,half).concat(genPhrase(r,ra.slice(half-1),a[half-1],r()<.7?0:5,lo,hi).slice(1));
    const toNotes=(steps,rh,off)=>steps.map((s,i)=>({m:degMidi(rootM+(off||0),scale,s),d:rh[i]}));
    const la=ra.reduce((p,q)=>p+q,0)*beat,lb=la;
    playAcc(S,t+x,(la+lb)*1.12+beat,beat,rootM,scale);playPercBar(S,t+x,(la+lb)*1.12,beat);
    x+=playLine(S,toNotes(a,ra),t+x,beat,{vel:.95})+beat*(.5+r());
    x+=playLine(S,toNotes(b,ra),t+x,beat,{vel:1})+beat;
    // 变奏：换节奏再来一句，偶尔翻高八度
    if(r()<.75){
      const c=genPhrase(r,rb,b[b.length-1]+(r()<.5?2:-1),0,lo,hi);
      const off=(r()<.3&&lead!=='qin')?12:0;
      playAcc(S,t+x,rb.reduce((p,q)=>p+q,0)*beat*1.1,beat,rootM,scale);
      x+=playLine(S,toNotes(c,rb,off),t+x,beat,{vel:.9})+beat;
    }
  }
  // 留白：只剩环境声，偶尔一声泛音或钟
  const rest=sc.rest?sc.rest[0]+r()*(sc.rest[1]-sc.rest[0]):4;
  const p=sc.perc||{};
  if(p.harm&&r()<p.harm){const k=2+Math.floor(r()*2);for(let i=0;i<k;i++)sHarm(S,t+x+.8+i*(1.1+r()*.6),degMidi(rootM+24,scale,Math.floor(r()*5)),.05,r()*.8-.4);}
  if(p.gu&&p.gu<=.5&&r()<.6)sPerc(S,'gu',t+x+rest*.5,38,p.gu,450,-.2);
  if(p.bell&&r()<.5)sBell(S,t+x+rest*.4,rootM-12,.06*p.bell);
  S.cyc++;
  return x+rest;
}

/* ---------- 调度 ---------- */
function v2Halt(){
  const S=AUDIO.sess;if(!S)return;
  clearTimeout(S.timer);clearInterval(S.ambTimer);S.dead=true;
  const t=S.ctx.currentTime;
  [S.out,S.sendOut].forEach(g=>{try{g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(0,t+.9);}catch(e){}});
  ambStop(S);
  setTimeout(()=>{try{S.out.disconnect();S.sendOut.disconnect();}catch(e){}},1500);
  AUDIO.sess=null;
}
function v2Session(ctx,tune,destDry,destRev){
  const sc=MSCENE[tune.k]||MSCENE.kongshan;
  const S={ctx:ctx,tune:tune,sc:sc,cyc:0,seed:hashStr((state.song?state.song.title:'')+'|'+tune.k)};
  S.rng=mulberry(S.seed);S.rng2=mulberry(S.seed^0x9e3779b9);
  S.out=ctx.createGain();S.out.gain.value=1;S.out.connect(destDry);
  S.sendOut=ctx.createGain();S.sendOut.gain.value=1;S.sendOut.connect(destRev);
  S.bus=ctx.createGain();S.bus.gain.value=2.5;S.bus.connect(S.out);
  S.send=ctx.createGain();S.send.gain.value=1.2;S.send.connect(S.sendOut);
  S.amb=ctx.createGain();S.amb.gain.value=2.0;S.amb.connect(S.out);
  const ambRev=ctx.createGain();ambRev.gain.value=.18;S.amb.connect(ambRev);ambRev.connect(S.sendOut);
  return S;
}
function v2Needs(tune){
  const sc=MSCENE[tune.k]||MSCENE.kongshan,s=new Set([SAMP_OF[sc.lead]]);
  if(sc.accIns)s.add(SAMP_OF[sc.accIns]);if(sc.pad)s.add(SAMP_OF[sc.pad]);
  const p=sc.perc||{};if(p.muyu)s.add('muyu');if(p.gu)s.add('gu');
  return Array.from(s);
}
function v2Prepare(ctx,tune){
  return loadSampleScript().then(ok=>{
    if(!ok)return false;
    return Promise.all(v2Needs(tune).map(i=>decodeIns(ctx,i))).then(a=>a.every(Boolean));
  });
}
function v2Start(){
  const ctx=AUDIO.ctx,T=AUDIO.tune;
  const token=AUDIO.v2Token=(AUDIO.v2Token||0)+1;
  v2Halt();
  return v2Prepare(ctx,T).then(ok=>{
    if(token!==AUDIO.v2Token||!AUDIO.on||AUDIO.tune!==T)return true;
    if(!ok)return false;
    const S=AUDIO.sess=v2Session(ctx,T,AUDIO.dry,AUDIO.revGain);
    ambStart(S,S.sc.amb||{});
    let next=ctx.currentTime+.25;
    const tick=()=>{
      if(S.dead)return;
      next+=conductCycle(S,next);
      S.timer=setTimeout(tick,Math.max(200,(next-ctx.currentTime-2.5)*1000));
    };
    let ambT=ctx.currentTime;
    const at=()=>{if(S.dead)return;const now=ctx.currentTime;ambPlan(S,Math.max(ambT,now),now+1.2);ambT=now+1.2;};
    at();S.ambTimer=setInterval(at,400);
    tick();
    return true;
  }).catch(()=>false);
}
/* 离线试听用：把某个场景渲成一段音频（不影响页面） */
function v2RenderOffline(k,seconds){
  const T=tuneByKey(k);if(!T)return Promise.reject('no tune');
  const sr=44100,ctx=new OfflineAudioContext(2,Math.ceil(sr*seconds),sr);
  const master=ctx.createGain();master.gain.value=MUS_VOL;
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=22;comp.ratio.value=4;comp.attack.value=.004;comp.release.value=.28;
  master.connect(comp);comp.connect(ctx.destination);
  const dry=ctx.createGain();dry.gain.value=.85;dry.connect(master);
  const rev=makeReverb(ctx,4.2,3.0),revGain=ctx.createGain();revGain.gain.value=T.rev;revGain.connect(rev);rev.connect(master);
  return v2Prepare(ctx,T).then(ok=>{
    if(!ok)throw new Error('samples');
    const S=v2Session(ctx,T,dry,revGain);
    ambStart(S,S.sc.amb||{});ambPlan(S,0,seconds);
    let x=.25;while(x<seconds)x+=conductCycle(S,x);
    return ctx.startRendering();
  });
}

  const go=()=>{

    if(!AUDIO.tune)return;
    AUDIO.on=true;AUDIO.phraseIdx=0;
    AUDIO.master.gain.cancelScheduledValues(ctx.currentTime);

function isMetaLine(s,idx){

  if(/(不得|禁止|请勿)翻[唱录]|翻[唱录]或(使用|传播)|未经.{0,10}(许可|授权).{0,24}(翻[唱录]|使用|转载|传播|商用)|版权归|版权所有|侵权必究|更多.{0,8}歌词|(歌词|歌曲).{0,10}(来自|由).{0,14}(提供|整理|上传)|(QQ音乐|酷狗音乐|酷我音乐|网易云音乐)|请(支持|购买)正版|仅供(参考|学习|试听|欣赏)/i.test(s))return true;
  if(/^(?:written|composed|produced|arranged|performed|directed|mixed|mastered|engineered|recorded|remixed)\s+by\b/i.test(s))return true;
  const cby=s.match(/^(?:lyrics?|words|music|composition|arrangement|production|vocals?|backing\s+vocals?|chorus|mixing|mastering|recording|engineering|guitars?|bass|drums?|keyboards?|piano|strings?|violin|cello|synth)\s*(?:,\s*[\w ]+?\s*)*(?:and\s+[\w ]+?\s*)?by\b\s*[:：]?\s*(.*)$/i);
  if(cby&&cby[1]&&cby[1].length<=42&&!/[.!?,;]$/.test(cby[1])&&!/^(?:the|a|an|my|your|our|his|her|its|their|this|that|these|those|myself|yourself|now|then|day|night|morning|you|me|him|us|it)\b/i.test(cby[1]))return true;
  if(/^(?:track|album|artist|feat(?:uring)?|label|studio|release[ds]?|publisher|copyright|isrc|℗|©)\b\s*[:：\-–]/i.test(s))return true;
  if(/^(lyrics|words|music|composed?|produced?|arranged?|performed?|written?|vocals?|vocal|rapper?|rap|album|studio|label|released?|mixed?|mastered?|recorded?|engineered?|remixed?|piano|guitar|bass|drums?|keyboard|strings?|chorus|backing|editor?|mixer|producer|arranger|engineer)\b[\s]{0,2}[:：\-\u2013-]/i.test(s))return true;
  if(/^lyrics?$/i.test(s))return true;
  if(idx<3&&/[\u4e00-\u9fa5]/.test(s)&&/^\S.{0,60}\s+[-\u2013-]\s+\S.{0,80}$/.test(s)&&!/[\u3002\uff01\uff1f!?\uff0c\uff1b]/.test(s))return true;
  return false;
}
function isCreditish(s){
  if(/[。！？!?…]/.test(s))return false;
  if(s.length>48)return false;
  const m=s.match(/^([^:：]{1,16})[:：]\s*(.{0,26})$/);
  if(!m)return false;
  const pre=m[1].trim(),post=(m[2]||'').trim();
  if(!pre||!post)return false;
  if(/^(他|她|你|我|它|咱)(们)?(说|问|想|喊|叫|道|哭|笑)/.test(pre))return false;
  if(/^[我你他她它咱]/.test(post))return false;
  return true;
}
function stripLyricTags(text){
  const out=[];let prev='';
  const raw=String(text).split(/\r?\n/);
  for(let i=0;i<raw.length;i++){
    let s=raw[i].replace(/\[[^\]]*\]/g,'').replace(/\u200b/g,'').trim();
    if(!s)continue;
    if(/^[\s\-\u2013~*·.。,，、♪♩♫♬♡♥′″`'"]+$/.test(s))continue;
    if(s===prev)continue;
    prev=s;
    out.push({t:s,meta:false});
  }
  out.forEach((o,i)=>{o.meta=isMetaLine(o.t,i);});
  let saw=false,end=0;
  const cap=Math.min(out.length,30);
  for(let i=0;i<cap;i++){
    if(out[i].meta){saw=true;end=i+1;continue;}
    if(saw&&isCreditish(out[i].t)){end=i+1;continue;}
    break;
  }
  for(let k=0;k<end;k++)out[k].meta=true;
  return out;
}

function loadSong(meta){
  try{
    const kept=meta.source==='POEM'
      ? String(meta.text).split(/\r?\n/).map(x=>x.replace(/\[[^\]]*\]/g,'').trim()).filter(Boolean).map(t=>({t:t,meta:false}))
      : stripLyricTags(meta.text).filter(p=>!p.meta);
    const raws=kept.map(p=>p.t);
    if(!raws.length){toast('没有解析到有效文本行，换一个试试');return;}
    const genre=meta.genre||LC.detectGenre(raws,meta.title,meta.source);
    state.song={title:meta.title,artist:meta.artist,source:meta.source,genre:genre,artwork:meta.artwork||null,raws,metas:kept.map(p=>false),lines:kept.map(p=>Object.assign(LC.analyzeLine(p.t,genre),{meta:false}))};
    state.sel=0;
    $('#mResults').hidden=true;$('#mPaste').hidden=true;
    $('#empty').hidden=true;$('#songHead').hidden=false;$('#lyrics').hidden=false;$('#summaryPanel').hidden=false;
    renderSongHead();renderLyrics();renderLinePanel();renderSummary();renderLibBtn();
    const box=$('#lyrics');box.scrollTop=0;
    if(typeof meta.line==='number'&&meta.line>0&&meta.line<state.song.lines.length)selectLine(meta.line);
    applyArtwork();
    refreshMusic();
    refreshDeco();
    trEnsure();
    try{localStorage.setItem('lyr-song',JSON.stringify({title:state.song.title,artist:state.song.artist,source:state.song.source,genre:state.song.genre,text:state.song.raws.join('\n'),artwork:state.song.artwork||null,line:state.sel,total:state.song.lines.length}));}catch(e){}
  }catch(err){
    console.error(err);
    toast('解析时出错：'+(err&&err.message?err.message:err));
  }
}

function songLang(){
  let zh=0,en=0;
  state.song.lines.forEach(L=>{L.units.forEach(u=>{if(u.k==='zh')zh++;else if(u.k==='en')en++;});});
  if(zh>en*2)return '中文';
  if(en>zh*2)return '英文';
  return zh+en>0?'中英混合':'';
}

function annotationText(L){
  let s='';
  L.units.forEach(u=>{
    if(u.k==='zh')s+=(u.a?(u.b+'('+u.a+')'):u.b);
    else if(u.k==='en')s+=(u.a?(u.b+' /'+u.a+(u.g?'≈':'')+'/'):u.b);
    else s+=u.b;
  });
  return s;
}
function copyText(text,okMsg){
  const done=()=>toast(okMsg||'已复制');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  }else fallbackCopy(text,done);
}
function fallbackCopy(text,done){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');done();}catch(e){toast('复制失败，请手动选择复制');}
  document.body.removeChild(ta);
}
function copyAll(){

function askPrompt(i){
  const L=state.song.lines[i];
  const g=state.song.genre||'lyric';
  const who=state.song.artist?('（'+state.song.artist+'）'):'';
  const ctx=[];
  for(let k=Math.max(0,i-2);k<Math.min(state.song.lines.length,i+3);k++){
    ctx.push((k===i?'→ ':'  ')+state.song.lines[k].raw);
  }
  if(g==='poem'){
    return '请解读这一句：\n\n「'+L.raw+'」\n\n出自《'+state.song.title+'》'+who+'。上下文：\n'+ctx.join('\n')+
      '\n\n请说明：1) 句中的典故与出处；2) 意象及其文化含义；3) 这一句在全篇中的作用与情感；4) 若有炼字之妙，指出来；5) 给出一句能保住意境的英文译句。';
  }
  if(g==='prose'){
    return '请赏析这一句：\n\n「'+L.raw+'」\n\n出自《'+state.song.title+'》'+who+'。上下文：\n'+ctx.join('\n')+
      '\n\n请说明：1) 用词与修辞；2) 若有典故或出处，指出来；3) 这句话好在哪里；4) 给出一句贴合语气的英文译句。';
  }
  return '请解释这一句歌词：\n\n「'+L.raw+'」\n\n出自《'+state.song.title+'》'+who+'。上下文：\n'+ctx.join('\n')+
    '\n\n请说明：1) 逐词或逐短语的意思；2) 语法结构（时态、句式、省略）；3) 其中的俚语或固定搭配；4) 整句的情感；5) 给出一句自然的中文译句（若原文为中文则给英文译句）。';
}

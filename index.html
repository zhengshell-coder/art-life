function selectLine(i){
  if(!state.song)return;
  if(i<0||i>=state.song.lines.length)return;
  state.sel=i;
  const lines=$('#lyrics').children;
  for(let k=0;k<lines.length;k++)lines[k].classList.toggle('sel',k===i);
  if(lines[i]&&lines[i].scrollIntoView)try{lines[i].scrollIntoView({block:'nearest'});}catch(e){}
  renderLinePanel();
  recordProgress();
  if(document.body.classList.contains('focusing'))syncFocus();
}

function syncFocus(){
  const sel=document.querySelector('#lyrics .line.sel');const fl=$('#focusLine');if(!sel||!fl)return;
  const lt=sel.querySelector('.ltext');
  fl.textContent='';
  const wrap=document.createElement('div');wrap.className='ltext';
  if(lt)wrap.innerHTML=lt.innerHTML;else wrap.textContent=(sel.textContent||'');
  fl.appendChild(wrap);
  trSyncFocus();
  const calc=()=>{
    const vw=(window.innerWidth||document.documentElement.clientWidth||1200)-48;
    const w=(wrap.scrollWidth||0)+88;
    const f=(w>vw&&w>0)?Math.max(.34,vw/w):1;
    fl.style.setProperty('--fit',f.toFixed(3));
  };
  calc();requestAnimationFrame(calc);
}
function openFocus(){syncFocus();document.body.classList.add('focusing');}
function closeFocus(){document.body.classList.remove('focusing');}

    });
    right.appendChild(del);
    row.appendChild(right);
    d.appendChild(row);

    const total=it.total||1;
    const cur=Math.min((it.line||0)+1,total);
    const pct=Math.round(cur/total*100);
    const pr=el('div','lib-prog');
    const bar=el('div','prog');
    const inner=el('i');inner.style.width=pct+'%';
    bar.appendChild(inner);

      loadSong({title:it.title,artist:it.artist,text:it.text,source:it.source,artwork:it.artwork||null,line:it.line||0});
    });
    frag.appendChild(d);
  });
  box.appendChild(frag);
}

function hashStr(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function autoSceneKey(){
  if(!state.song)return 'sky';
  const txt=state.song.raws.join('\n')+'\n'+state.song.title+' '+(state.song.artist||'');
  let best=-1,bn=0;
  SCENE_RE.forEach((re,i)=>{re.lastIndex=0;const m=txt.match(re);const n=m?m.length:0;if(n>bn){bn=n;best=i;}});
  if(best<0)best=hashStr(state.song.title+'|'+(state.song.artist||''))%SCENES.length;
  return SCENES[best].k;
}
function applyScene(key){
  const sc=SCENES.find(x=>x.k===key)||SCENES[1];
  const r=document.documentElement.style;
  r.setProperty('--bg1',sc.c[0]);r.setProperty('--bg2',sc.c[1]);r.setProperty('--bg3',sc.c[2]);
  r.setProperty('--bg4',sc.c[3]);r.setProperty('--bg5',sc.c[4]);
  r.setProperty('--tint',sc.c[3]);
  r.setProperty('--ac',sc.ac);r.setProperty('--ac2',sc.ac2);
  r.setProperty('--ac-soft',sc.ac+'1f');
  r.setProperty('--scrim',sc.sc);
  document.body.setAttribute('data-scene',sc.k);
}
function scenePref(){try{return localStorage.getItem('lyr-scene')||'auto';}catch(e){return 'auto';}}
function refreshScene(){
  const pref=scenePref();
  applyScene(pref==='auto'?autoSceneKey():pref);
  const sel=$('#sceneSel');if(sel&&sel.value!==pref)sel.value=pref;
}

async function searchLrclib(q){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),12000);
  try{
    const r=await fetch('https://lrclib.net/api/search?q='+encodeURIComponent(q),{signal:ctrl.signal});
    clearTimeout(timer);
    if(!r.ok)throw new Error('http '+r.status);
    let list=await r.json();
    if(!Array.isArray(list))list=[];
    return list.filter(x=>!x.instrumental&&(x.plainLyrics||x.syncedLyrics)).map(x=>({
      source:'LRCLIB',trackName:x.track_name||x.title||'',artistName:x.artist_name||x.artist||'',
      albumName:x.album_name||'',duration:x.duration||0,plainLyrics:x.plainLyrics||'',syncedLyrics:x.syncedLyrics||''
    }));
  }catch(e){
    clearTimeout(timer);
    if(e.name==='AbortError')throw e;
    return [];
  }
}
function qqSearch(q){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    const t=setTimeout(()=>{cleanup();rej(new Error('timeout'));},9000);
    const cleanup=()=>{clearTimeout(t);try{delete window.callback;}catch(e){window.callback=undefined;}if(s.parentNode)s.parentNode.removeChild(s);};
    window.callback=data=>{
      cleanup();
      try{
        const ls=(data&&data.data&&data.data.song&&data.data.song.list)||[];
        const out=[];
        for(let i=0;i<ls.length;i++){
          const x=ls[i];
          if(!x||!x.mid)continue;
          out.push({source:'QQ',trackName:x.name||'',artistName:(x.singer||[]).map(g=>g.name).filter(Boolean).join('/'),albumName:(x.album&&x.album.name)||'',duration:x.interval||0,songMid:x.mid,albumMid:(x.album&&x.album.mid)||''});
        }
        res(out);
      }catch(e){rej(e);}
    };
    s.onerror=()=>{cleanup();rej(new Error('network'));};
    s.src='https://c.y.qq.com/soso/fcgi-bin/client_search_cp?w='+encodeURIComponent(q)+'&format=jsonp&p=1&n=20&aggr=1&lossless=0&cr=1&new_json=1';
    document.head.appendChild(s);
  });
}
function qqLyric(songMid){
  return new Promise((res,rej)=>{
    const cb='__qql'+Date.now()+Math.floor(Math.random()*100000);
    const payload=JSON.stringify({comm:{ct:24,cv:0},req:{module:'music.musichallSong.PlayLyricInfo',method:'GetPlayLyricInfo',param:{songMid:songMid,qrc:0,trans:0}}});
    const s=document.createElement('script');
    const t=setTimeout(()=>{cleanup();rej(new Error('timeout'));},9000);
    const cleanup=()=>{clearTimeout(t);try{delete window[cb];}catch(e){window[cb]=undefined;}if(s.parentNode)s.parentNode.removeChild(s);};
    window[cb]=d=>{
      cleanup();
      try{
        const r=d&&d.req;
        if(r&&r.code===0&&r.data&&r.data.lyric){
          const bin=atob(r.data.lyric);
          const bytes=new Uint8Array(bin.length);
          for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
          const text=new TextDecoder('utf-8').decode(bytes);
          if(text&&text.length>10){res(text);return;}
        }
        rej(new Error('no lyric'));
      }catch(e){rej(e);}
    };
    s.onerror=()=>{cleanup();rej(new Error('network'));};
    s.src='https://u.y.qq.com/cgi-bin/musicu.fcg?data='+encodeURIComponent(payload)+'&callback='+cb;
    document.head.appendChild(s);
  });
}

async function doSearch(){
  const q=$('#q').value.trim();
  if(!q){toast('输入歌名、诗词名或作者，例如：静夜思 · 晴天 周杰伦');return;}
  const btn=$('#btnSearch');
  const poems=searchPoems(q);
  if(poems.length)showResults([],[],poems);   // 内置诗词不必等网络，先弹出来
  btn.disabled=true;btn.textContent='搜索中…';
  try{
    const both=await Promise.allSettled([searchLrclib(q),qqSearch(q)]);
    const lrc=both[0].status==='fulfilled'?both[0].value:[];
    const qq=both[1].status==='fulfilled'?both[1].value:[];
    if(!lrc.length&&!qq.length&&!poems.length){
      toast('内置诗词库、LRCLIB、QQ音乐 都没找到，换个关键词，或直接粘贴文本');
      return;
    }
    showResults(lrc.slice(0,12),qq.slice(0,10),poems);
  }catch(e){
    if(!poems.length)toast(e.name==='AbortError'?'搜索超时，请检查网络后重试':'搜索失败：'+(e.message||'网络错误')+'（需要联网）');
  }finally{
    btn.disabled=false;btn.textContent='搜索';
  }
}
function showResults(lrclibList,qqList,poemList){
  const box=$('#resList');box.textContent='';
  const frag=document.createDocumentFragment();
  if(poemList&&poemList.length){
    frag.appendChild(el('div','src-h','内置诗词'));
    poemList.forEach(p=>frag.appendChild(poemRow(p)));
  }
  if(qqList&&qqList.length){
    const head=el('div','src-h','QQ音乐');
    frag.appendChild(head);
    qqList.forEach(item=>frag.appendChild(resultRow(item)));
  }
  if(lrclibList&&lrclibList.length){
    const head=el('div','src-h','LRCLIB');
    frag.appendChild(head);
    lrclibList.forEach(item=>frag.appendChild(resultRow(item)));
  }
  box.appendChild(frag);
  $('#mResults').hidden=false;
}

function resultRow(item){
  const d=el('div','res');
  const l=el('div');
  l.appendChild(el('div','rt',item.trackName||'未知歌曲'));
  l.appendChild(el('div','ra',(item.artistName||'未知歌手')+(item.albumName?' · '+item.albumName:'')));

  if(item.duration){
    const m=Math.floor(item.duration/60),s=Math.round(item.duration%60);
    r.appendChild(el('div',null,m+':'+String(s).padStart(2,'0')));
  }

  d.addEventListener('click',()=>{

      qqLyric(item.songMid).then(text=>{
        loadSong({title:item.trackName,artist:item.artistName,text,source:'QQ',artwork:item.albumMid?('https://y.gtimg.cn/music/photo_new/T002R800x800M000'+item.albumMid+'.jpg'):null});
        toast('已加载：'+item.trackName+(item.artistName?' - '+item.artistName:''));
      }).catch(()=>toast('QQ音乐没有返回这首歌的歌词（可能是 VIP 歌曲），换一个结果试试'));
    }else{
      let text=item.plainLyrics;
      if(!text&&item.syncedLyrics)text=item.syncedLyrics;
      loadSong({title:item.trackName||'未知歌曲',artist:item.artistName||'',text,source:'LRCLIB'});
      toast('已加载：'+(item.trackName||'')+(item.artistName?' - '+item.artistName:''));
    }
  });
  return d;
}

ng splendid and his spirit high.","Feather fan, silk kerchief —","and in the time it took to talk and laugh, masts and oars went up in ash and smoke.","My spirit wanders in that old country.","You may well laugh at a man of so much feeling,","whose hair has gone white so early.","Life is a dream —","one cup, then, poured out to the river and the moon."],"江城子·乙卯正月二十日夜记梦|苏轼":["Ten years: the living and the dead, each lost to the other.","I do not set myself to think of you — and cannot forget.","A lonely grave a thousand li away,","and nowhere to speak of this desolation.","Even if we met, you would not know me:","dust over my face, and frost at my temples.","Last night, in a faint dream, I was suddenly home again.","At the little window you sat dressing your hair.","We looked at each other and said nothing —","only the tears came down in a thousand lines.","And I know where, year after year, the heart must break:","a night of bright moon, the ridge of stunted pines."],"定风波·莫听穿林打叶声|苏轼":["Don't listen to the rain driving through the wood, beating the leaves;","what harm is there in chanting aloud and walking slowly on?","Bamboo staff and straw sandals go lighter than a horse.","Who's afraid?","One straw cape, and I'll take the mist and rain as my whole life.","The sharp spring wind blows me sober;","there's a slight chill —","but the slanting light on the hilltop comes out to meet me.","I look back on the bleak place I came through.","Going home:","neither wind nor rain now, and no fair weather either."],"声声慢·寻寻觅觅|李清照":["Searching, searching, seeking, seeking,","cold and cold, clear and clear,","wretched and wretched, wounded, forlorn.","This season of sudden warmth turning back to cold","is hardest of all to rest in.","Two cups, three cups of thin wine —","how are they a match for the wind that comes up hard at evening?","The wild geese pass,","and just as my heart is breaking","I find they are the ones I knew long ago.","Yellow flowers lie heaped over the ground,","w const TR={
  on:false,                 // 译文开关
  cache:Object.create(null),// dir原文 -> 译文
  queue:[],                 // 待译：{dir, text}
  seen:Object.create(null), // 已入队去重
  map:null,                 // 单句精译索引
  busy:false,
  fail:0,                   // 连续失败次数
  warned:false
};
const TRKEY='lyr-tr-cache';
function trLoadCache(){
  try{
    const s=localStorage.getItem(TRKEY);
    if(s){const o=JSON.parse(s);if(o&&typeof o==='object')TR.cache=Object.assign(Object.create(null),o);}
  }catch(e){}
}
let trSaveTimer=null;
function trSaveCache(){
  if(trSaveTimer)clearTimeout(trSaveTimer);
  trSaveTimer=setTimeout(()=>{
    try{
      let o=TR.cache,ks=Object.keys(o);
      if(ks.length>3000){const t=Object.create(null);ks.slice(-3000).forEach(k=>t[k]=o[k]);TR.cache=o=t;}
      localStorage.setItem(TRKEY,JSON.stringify(o));
    }catch(e){}
  },600);
}
function trNorm(s){
  return String(s).replace(/[\s　]+/g,'')
    .replace(/[，。、；：！？“”‘’（）《》〈〉…—·「」【】〔〕,.;:!?"'()\[\]\-–—~]/g,'')
    .toLowerCase();
}
function trBuildMap(){
  if(TR.map)return TR.map;
  const m=Object.create(null);
  try{
    POEMS.forEach(p=>{
      const en=POEM_EN[p.t+'|'+p.a];
      if(!en)return;
      const zh=String(p.x).split('\n');
      if(zh.length!==en.length)return;
      for(let i=0;i<zh.length;i++){
        const k=trNorm(zh[i]);
        if(!k)continue;
        if(k in m){if(m[k]!==en[i])m[k]='';}   // 同句多义 -> 作废，避免张冠李戴
        else m[k]=en[i];
      }
    });
  }catch(e){}
  for(const k in SONG_EN){const n=trNorm(k);if(n)m[n]=SONG_EN[k];}
  TR.map=m;return m;
}
function trDir(L){return (L&&L.lang==='en')?'en2zh':'zh2en';}
/* 精译：整篇标题命中优先，其次单句命中 */
function trFine(song,i){
  if(!song)return null;
  if(song.genre!=='lyric'||song.source==='POEM'){
    const key=String(song.title||'').replace(/[《》]/g,'').trim()+'|'+String(song.artist||'').trim();
    const en=POEM_EN[key];
    if(en&&en.length===song.raws.length&&en[i])return en[i];
  }
  const v=trBuildMap()[trNorm(song.raws[i])];
  return v?v:null;
}
/* 取一句译文：{t:译文, k:'fine'|'mt'} 或 null（未就绪） */
function trGet(song,i){
  if(!song)return null;
  const f=trFine(song,i);
  if(f)return {t:f,k:'fine'};
  const L=song.lines[i];
  if(!L||L.lang==='none')return null;
  const raw=song.raws[i];
  const ck=trDir(L)+''+raw;
  const c=TR.cache[ck];
  return c?{t:c,k:'mt'}:null;
}
/* 把整篇缺译的句子排进队列 */
function trEnsure(){
  if(!TR.on||!state.song)return;
  const song=state.song;
  for(let i=0;i<song.raws.length;i++){
    if(trGet(song,i))continue;
    const L=song.lines[i];
    if(!L||L.lang==='none')continue;
    const raw=song.raws[i];
    if(!raw||raw.length>480)continue;
    const dir=trDir(L),k=dir+''+raw;
    if(TR.seen[k])continue;
    TR.seen[k]=1;
    TR.queue.push({dir:dir,text:raw});
  }
  trPump();
}
const TRLANG={zh2en:['zh-CN','en'],en2zh:['en','zh-CN']};
function trFetchBatch(texts,dir){
  const p=TRLANG[dir],q=texts.join('\n');
  const url='https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl='+p[0]+'&tl='+p[1]+'&q='+encodeURIComponent(q);
  return fetch(url).then(r=>{if(!r.ok)throw new Error('gtx '+r.status);return r.json();}).then(j=>{
    if(!j||!j[0]||!j[0].length)throw new Error('gtx shape');
    let s='';
    j[0].forEach(seg=>{if(seg&&typeof seg[0]==='string')s+=seg[0];});
    const out=s.split('\n').map(x=>x.trim()).filter((x,i,a)=>true);
    if(out.length!==texts.length)throw new Error('gtx align '+out.length+'/'+texts.length);
    return out;
  });
}
function trFetchOne(text,dir){
  const p=TRLANG[dir];
  const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+encodeURIComponent(p[0]+'|'+p[1]);
  return fetch(url).then(r=>{if(!r.ok)throw new Error('mm '+r.status);return r.json();}).then(j=>{
    const t=j&&j.responseData&&j.responseData.translatedText;
    if(!t||/MYMEMORY WARNING|QUERY LENGTH LIMIT|INVALID/i.test(t))throw new Error('mm body');
    return String(t).trim();
  });
}
function trPump(){
  if(TR.busy||!TR.queue.length||!TR.on)return;
  if(TR.fail>=3){trOffline();return;}
  const dir=TR.queue[0].dir,batch=[];
  for(let i=0;i<TR.queue.length&&batch.length<16;i++){
    if(TR.queue[i].dir===dir)batch.push(TR.queue[i]);
  }
  TR.busy=true;
  const texts=batch.map(b=>b.text);
  const done=outs=>{
    for(let i=0;i<batch.length;i++){
      const o=outs[i];
      if(o)TR.cache[batch[i].dir+''+batch[i].text]=o;
    }
    TR.fail=0;trSaveCache();
    TR.queue=TR.queue.filter(x=>batch.indexOf(x)<0);
    TR.busy=false;trPaint();
    if(TR.queue.length)setTimeout(trPump,220);
  };
  trFetchBatch(texts,dir)
    .then(done)
    .catch(()=>{
      // 退回逐句接口，只补前 8 句，避免慢与限流
      const sub=batch.slice(0,8);
      return Promise.all(sub.map(b=>trFetchOne(b.text,b.dir).catch(()=>null)))
        .then(outs=>{
          if(outs.every(x=>!x))throw new Error('all failed');
          for(let i=0;i<sub.length;i++)if(outs[i])TR.cache[sub[i].dir+''+sub[i].text]=outs[i];
          trSaveCache();
          TR.queue=TR.queue.filter(x=>sub.indexOf(x)<0);
          TR.fail=0;TR.busy=false;trPaint();
          if(TR.queue.length)setTimeout(trPump,420);
        });
    })
    .catch(()=>{
      TR.fail++;TR.busy=false;
      if(TR.fail>=3){trOffline();}
      else setTimeout(trPump,900);
      trPaint();
    });
}
function trOffline(){
  TR.queue=[];TR.seen=Object.create(null);
  if(!TR.warned){
    TR.warned=true;
    toast('联不上翻译服务：内置精译的诗词照常显示，其余句子暂时无法机译');
  }
  trPaint();
}
function trPending(){
  return TR.busy||TR.queue.length>0;
}
/* 把译文刷进左侧每一行（不重建 DOM，异步到达也能补上） */
function trPaint(){
  const box=$('#lyrics');
  if(!box||!state.song)return;
  const kids=box.children;
  for(let i=0;i<kids.length;i++){
    const body=kids[i].querySelector('.lbody');
    if(!body)continue;
    let node=body.querySelector('.tr');
    if(!TR.on){if(node)node.remove();continue;}
    const g=trGet(state.song,i);
    const L=state.song.lines[i];
    let txt,cls;
    if(g){txt=g.t;cls='tr'+(g.k==='fine'?' fine':'')+(L&&L.lang==='en'?' zh':'');}
    else if(L&&L.lang==='none'){if(node)node.remove();continue;}
    else if(trPending()){txt='翻译中…';cls='tr dim';}
    else {txt=(L&&L.lang==='en')?'（暂无译文）':'（暂无译文，联网后自动补齐）';cls='tr dim';}
    if(!node){node=el('div',cls,txt);body.appendChild(node);}
    else{node.className=cls;node.textContent=txt;}
  }
  trSyncPanel();
  if(document.body.classList.contains('focusing'))trSyncFocus();
}
function trSyncPanel(){
  const host=$('#trPanel');
  if(!host)return;
  if(!TR.on||!state.song||state.sel<0){host.hidden=true;host.textContent='';return;}
  const g=trGet(state.song,state.sel);
  host.textContent='';
  host.hidden=false;
  const h=el('div','tr-h');
  h.appendChild(el('span','sec-h-in','译文'));
  if(g)h.appendChild(el('span','tr-tag '+(g.k==='fine'?'fine':'mt'),g.k==='fine'?'精译':'机译'));
  else if(trPending())h.appendChild(el('span','tr-tag dim','翻译中'));
  host.appendChild(h);
  const L=state.song.lines[state.sel];
  host.appendChild(el('div','tr-body'+(L&&L.lang==='en'?' zh':''),
    g?g.t:(trPending()?'…':'暂无译文。可点下方按钮，把这一句连同上下文复制去问 AI。')));
}
function trSyncFocus(){
  const fl=$('#focusLine');
  if(!fl)return;
  let node=fl.querySelector('.tr-focus');
  if(!TR.on||!state.song||state.sel<0){if(node)node.remove();return;}
  const g=trGet(state.song,state.sel);
  const L=state.song.lines[state.sel];
  const txt=g?g.t:(trPending()?'翻译中…':'');
  if(!txt){if(node)node.remove();return;}
  if(!node){node=el('div','tr-focus'+(L&&L.lang==='en'?' zh':''),txt);fl.appendChild(node);}
  else{node.className='tr-focus'+(L&&L.lang==='en'?' zh':'');node.textContent=txt;}
}
function trToggle(){
  TR.on=!TR.on;
  document.body.classList.toggle('trn',TR.on);
  const b=$('#btnTr');
  if(b){b.classList.toggle('on',TR.on);b.title=TR.on?'关闭译文':'显示译文（英文歌词配中文，中文歌词与诗词配英文）';}
  try{localStorage.setItem('lyr-tr-on',TR.on?'1':'0');}catch(e){}
  if(TR.on){TR.fail=0;TR.warned=false;renderLyrics();trEnsure();trPaint();}
  else{trPaint();}
  toast(TR.on?'译文已开启':'译文已关闭');
}
function trInit(){
  try{window.__tr=TR;window.__trApi={loadSong:loadSong,selectLine:selectLine,openFocus:openFocus,closeFocus:closeFocus,trPaint:trPaint,trEnsure:trEnsure,trGet:trGet};}catch(e){}
  trLoadCache();
  try{TR.on=localStorage.getItem('lyr-tr-on')==='1';}catch(e){}
  document.body.classList.toggle('trn',TR.on);
  const b=$('#btnTr');
  if(b){
    b.classList.toggle('on',TR.on);
    b.title=TR.on?'关闭译文':'显示译文（英文歌词配中文，中文歌词与诗词配英文）';
    b.addEventListener('click',trToggle);
  }
}

   交互按 iOS 习惯重排：
     顶栏（标题 + 译 + 配乐）· 底部标签栏（品读 / 搜索 / 粘贴 / 收藏 / 设置）
     点一句 → 底部半屏抽屉显示解析（下拉关闭，左右滑切换上下句）

     诗词：山水画做成页首横幅；歌词：干净的纯文字

  // 0.5 秒静音（8kHz 8bit）：用来把 iOS 的音频会话切到“播放”类别，静音键下配乐照样能响
  const n=4000,h=new Uint8Array(44+n),dv=new DataView(h.buffer);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)h[o+i]=s.charCodeAt(i);};
  w(0,'RIFF');dv.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);
  dv.setUint16(22,1,true);dv.setUint32(24,8000,true);dv.setUint32(28,8000,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);
  w(36,'data');dv.setUint32(40,n,true);h.fill(128,44);
  let s='';for(let i=0;i<h.length;i++)s+=String.fromCharCode(h[i]);return btoa(s);
})();

function mEl(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;}
function mTab(k){document.querySelectorAll('#mTabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));}
function mCloseAll(except){
  if(except!=='search')document.body.classList.remove('ms-open');
  if(except!=='sheet')mCloseSheet();
  ['#mPaste','#mLib','#mMore','#mResults'].forEach(s=>{if(s!=='#m'+except){const e=$(s);if(e)e.hidden=true;}});
}
function mOpenSearch(){
  mCloseAll('search');document.body.classList.add('ms-open');mTab('search');
  setTimeout(()=>{try{$('#q').focus();}catch(e){}},280);
}
function mCloseSearch(){document.body.classList.remove('ms-open');try{$('#q').blur();}catch(e){}mTab('read');}
/* ---- 解析抽屉 ---- */
function mOpenSheet(){
  if(!state.song||state.sel<0)return;
  document.body.classList.add('sheet-open');
  const s=$('.col-r');s.style.transform='';
  requestAnimationFrame(mKeepLineVisible);
}
function mCloseSheet(){document.body.classList.remove('sheet-open');const s=$('.col-r');if(s)s.style.transform='';}
function mKeepLineVisible(){
  const sel=document.querySelector('#lyrics .line.sel');if(!sel)return;
  const r=sel.getBoundingClientRect(),vh=window.innerHeight;
  const sheet=document.body.classList.contains('sheet-open')?$('.col-r').getBoundingClientRect().height:0;
  const top=($('#mBar').getBoundingClientRect().bottom||60)+14,bottom=vh-sheet-14;
  if(r.top<top||r.bottom>bottom){
    const want=top+Math.max(0,(bottom-top-r.height)*.28);
    window.scrollBy({top:r.top-want,behavior:'smooth'});
  }
}
function mStep(d){
  if(!state.song)return;
  const i=Math.max(0,Math.min(state.song.lines.length-1,state.sel+d));
  if(i!==state.sel){selectLine(i);}
}
function mSwipe(el,opt){
  let x0=0,y0=0,t0=0,drag=false,lock=null;
  el.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now();drag=false;lock=null;
    if(opt.start)opt.start(e);
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(e.touches.length!==1)return;
    const dx=e.touches[0].clientX-x0,dy=e.touches[0].clientY-y0;
    if(!lock&&(Math.abs(dx)>8||Math.abs(dy)>8))lock=Math.abs(dx)>Math.abs(dy)?'x':'y';
    if(lock==='y'&&opt.dragDown&&dy>0&&opt.canDrag&&opt.canDrag(e)){
      drag=true;e.preventDefault();opt.dragDown(dy);
    }
  },{passive:false});
  el.addEventListener('touchend',e=>{
    const c=e.changedTouches[0],dx=c.clientX-x0,dy=c.clientY-y0,dt=Date.now()-t0;
    if(drag){opt.release&&opt.release(dy,dy/Math.max(1,dt));return;}
    if(lock==='x'&&Math.abs(dx)>56&&Math.abs(dx)>Math.abs(dy)*1.5&&dt<700){
      opt.horiz&&opt.horiz(dx<0?1:-1);
    }
  },{passive:true});
}
/* ---- 横幅：把山水画按屏宽缩放 ---- */
function mFitBanner(){
  const b=$('#mBanner'),p=$('#decoPoem');if(!b||!p)return;
  const w=b.clientWidth||window.innerWidth-24,s=w/300;
  p.style.transform='scale('+s.toFixed(4)+')';
  b.style.height=(214*s).toFixed(1)+'px';
}
function mUpdateTitle(){
  const t=$('#mTitle');if(!t)return;
  const h=$('#songHead');
  if(!state.song||!h||h.hidden){t.textContent='艺术人生';t.classList.remove('song');return;}
  const r=h.getBoundingClientRect();
  const out=r.bottom<($('#mBar').getBoundingClientRect().bottom+4);
  t.textContent=out?state.song.title:'艺术人生';
  t.classList.toggle('song',out);
}

function mInit(){
  if(!IS_M)return;
  const B=document.body;
  // ---- 顶栏 ----
  const bar=mEl('<div id="mBar"><div class="mb-logo">'+$('.logo').innerHTML+'</div><div id="mTitle">艺术人生</div><div class="mb-acts"></div></div>');
  B.appendChild(bar);
  const acts=bar.querySelector('.mb-acts');
  acts.appendChild($('#btnTr'));acts.appendChild($('#btnMusic'));
  // ---- 底部标签栏 ----
  const tabs=mEl('<nav id="mTabs">'+
    [['read','品读','book'],['search','搜索','search'],['paste','粘贴','paste'],['lib','收藏','star'],['more','设置','gear']]
      .map(([k,n,ic])=>'<button data-k="'+k+'">'+MI[ic]+'<span>'+n+'</span></button>').join('')+'</nav>');
  B.appendChild(tabs);
  tabs.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    const k=b.dataset.k;
    if(k==='read'){mCloseAll();mTab('read');
      const sel=document.querySelector('#lyrics .line.sel');
      if(sel)sel.scrollIntoView({block:'center',behavior:'smooth'});else window.scrollTo({top:0,behavior:'smooth'});}
    else if(k==='search')mOpenSearch();
    else if(k==='paste'){mCloseAll('Paste');$('#mPaste').hidden=false;mTab('paste');}
    else if(k==='lib'){mCloseAll('Lib');renderLib();$('#mLib').hidden=false;mTab('lib');}
    else if(k==='more'){mCloseAll('More');$('#mMore').hidden=false;mTab('more');}
  });
  mTab('read');
  // ---- 搜索页（整屏，自下而上）----
  const sp=mEl('<div id="mSearch"><div class="ms-top"></div>'+
    '<div class="ms-body"><div class="ms-hint"></div><div class="ms-res"></div></div></div>');
  B.appendChild(sp);
  sp.querySelector('.ms-top').appendChild($('.searchbox'));
  const cancel=mEl('<button class="ms-cancel">取消</button>');sp.querySelector('.ms-top').appendChild(cancel);
  cancel.addEventListener('click',mCloseSearch);
  $('#q').setAttribute('enterkeyhint','search');$('#q').placeholder='歌名 / 诗词名 / 作者';
  const hint=sp.querySelector('.ms-hint');
  hint.appendChild(el('div','ms-h','诗词库 · 不用联网'));
  const chips=el('div','ms-chips');
  ['静夜思','将进酒','水调歌头','念奴娇','声声慢','春江','登高','李白','苏轼','李清照'].forEach(w=>{
    const c=el('button','ms-chip',w);c.addEventListener('click',()=>{$('#q').value=w;doSearch();});chips.appendChild(c);});
  hint.appendChild(chips);
  hint.appendChild(el('div','ms-h','示例'));
  const ex=el('div','ms-chips');
  [['中文歌词示例',()=>loadSong(DEMO_ZH)],['英文歌词示例',()=>loadSong(DEMO_EN)],
   ['诗词示例 · 锦瑟',()=>{const p=POEMS.filter(x=>x.t==='锦瑟')[0]||POEMS[0];loadSong({title:p.t,artist:p.a,text:p.x,source:'POEM',genre:'poem'});}]]
    .forEach(([n,f])=>{const c=el('button','ms-chip',n);c.addEventListener('click',f);ex.appendChild(c);});
  hint.appendChild(ex);
  sp.querySelector('.ms-res').appendChild($('#resList'));
  // ---- 设置页 ----
  const more=mEl('<div class="mask" id="mMore" hidden><div class="m-card"><div class="m-h"><span>设置</span><button class="x" data-close>完成</button></div><div class="m-b mm-list"></div></div></div>');
  B.appendChild(more);
  const list=more.querySelector('.mm-list');
  const row=(label,node,note)=>{const r=el('div','mm-row');r.appendChild(el('div','mm-l',label));const v=el('div','mm-v');v.appendChild(node);r.appendChild(v);list.appendChild(r);if(note)list.appendChild(el('div','mm-note',note));};
  row('背景',$('#sceneSel').closest('.sel-wrap'));
  row('配乐',$('#musicSel').closest('.sel-wrap'),'只给诗词和散文配乐；歌词因版权不配。第一次需要点一下屏幕才会出声。');
  row('字号',$('.fs-ctrl'));
  row('自测模式',$('#selftest').closest('label'),'隐藏注音，点某句才显示答案。');
  list.appendChild(el('div','mm-note','收藏和阅读进度保存在这台手机上，和 Mac 版互不影响。'));
  // 关闭按钮（新建的面板也要能关）
  document.querySelectorAll('#mMore [data-close],#mPaste [data-close],#mLib [data-close]').forEach(b=>b.addEventListener('click',()=>{mTab('read');}));
  ['#mPaste','#mLib','#mMore'].forEach(s=>{const m=$(s);m.addEventListener('click',e=>{if(e.target===m){m.hidden=true;mTab('read');}});});
  more.querySelector('[data-close]').addEventListener('click',()=>{more.hidden=true;});
  // ---- 粘贴：加一个「从剪贴板粘贴」----
  if(navigator.clipboard&&navigator.clipboard.readText){
    const pb=el('button','ghost','从剪贴板粘贴');
    pb.addEventListener('click',()=>{navigator.clipboard.readText().then(t=>{if(t){$('#pasteText').value=t;}}).catch(()=>toast('没拿到剪贴板内容，长按输入框选择「粘贴」也可以'));});
    const bp=$('#btnParse').parentNode;bp.style.display='flex';bp.style.gap='10px';bp.style.justifyContent='flex-end';bp.insertBefore(pb,$('#btnParse'));
  }
  $('#pasteText').rows=9;
  // ---- 解析抽屉 ----
  const col=$('.col-r');
  col.insertBefore(el('div','m-grip'),col.firstChild);
  mSwipe(col,{
    canDrag:e=>{const lp=$('#linePanel');return lp.scrollTop<=0||e.target.closest('.m-grip');},
    dragDown:dy=>{col.style.transition='none';col.style.transform='translateY('+dy+'px)';},
    release:(dy,v)=>{col.style.transition='';if(dy>110||v>.6){mCloseSheet();}else col.style.transform='';},
    horiz:d=>mStep(d)
  });
  col.querySelector('.m-grip').addEventListener('click',mCloseSheet);
  // 大字卡：左右滑切句
  mSwipe($('#focusStage'),{horiz:d=>mStep(d)});
  mSwipe($('#focusbg'),{horiz:d=>mStep(d)});
  $('#focusLine').addEventListener('click',()=>{closeFocus();});
  // ---- 诗词横幅 ----
  const banner=el('div');banner.id='mBanner';
  const head=$('#songHead');head.parentNode.insertBefore(banner,head);
  banner.appendChild($('#decoPoem'));
  window.addEventListener('resize',mFitBanner);
  // ---- 空状态放竻米 ----
  const pet=$('#petLeft img');
  if(pet){const im=pet.cloneNode();im.className='m-pet';$('#empty').insertBefore(im,$('#empty').firstChild);}
  // ---- 滚动时顶栏标题切成作品名（iOS 大标题的感觉）----
  window.addEventListener('scroll',mUpdateTitle,{passive:true});
  // ---- iOS 音频 ----
  document.addEventListener('touchend',mAudioUnlock,{passive:true});
  // ---- 包装几个函数：手机上的行为不同 ----
  const _showResults=showResults;
  showResults=function(){_showResults.apply(this,arguments);$('#mResults').hidden=true;hint.hidden=true;};
  const _loadSong=loadSong;
  loadSong=function(meta){
    if(meta&&!meta.line)meta.line=0;
    _loadSong(meta);
    mCloseAll();mTab('read');hint.hidden=false;
    document.body.classList.remove('sheet-open');
    requestAnimationFrame(()=>{mFitBanner();window.scrollTo({top:0});mUpdateTitle();});
  };
  const _refreshDeco=refreshDeco;
  refreshDeco=function(){_refreshDeco();banner.hidden=$('#decoPoem').hidden;mFitBanner();};
  const _selectLine=selectLine;
  selectLine=function(i){
    _selectLine(i);
    if(document.body.classList.contains('sheet-open'))requestAnimationFrame(mKeepLineVisible);
  };
  const _renderLinePanel=renderLinePanel;
  renderLinePanel=function(){
    _renderLinePanel();
    const h=document.querySelector('#linePanel .p-h > div:last-child');
    if(h&&state.song&&state.sel>=0){
      const big=el('button','mini m-big','大字');
      big.addEventListener('click',()=>{openFocus();});
      h.insertBefore(big,h.firstChild);
    }
  };
  // 已经渲染过的内容按新规则重画一遍
  if(state.song){renderLinePanel();}
  refreshDeco();mUpdateTitle();
}
document.addEventListener('DOMContentLoaded',mInit);
/* 离线：网页版注册 Service Worker（本地 file:// 的 Mac 版不需要） */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}

})();


</script>
